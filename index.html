// TIMELINE ROADMAP (Planejamento Temporal)
// ═══════════════════════════════════════════════════════════════
function renderTimeline(){
  const el=document.getElementById('view-timeline');
  if(!el)return;

  const NOW   = new Date(); NOW.setHours(0,0,0,0);
  const D3    = new Date(NOW); D3.setDate(D3.getDate()+3);
  const D7    = new Date(NOW); D7.setDate(D7.getDate()+7);
  const D15   = new Date(NOW); D15.setDate(D15.getDate()+15);
  const D30   = new Date(NOW); D30.setDate(D30.getDate()+30);

  function parseDate(iso){
    if(!iso)return null;
    const [y,m,d]=iso.split('-');
    const dt=new Date(Number(y),Number(m)-1,Number(d)); dt.setHours(0,0,0,0);
    return dt;
  }

  // Gather & filter
  let tasks = allTasks().filter(t=>t.status!=='concluido');
  if(tlFilterClient)   tasks=tasks.filter(t=>t.client===tlFilterClient);
  if(tlFilterStatus)   tasks=tasks.filter(t=>t.status===tlFilterStatus);
  if(tlFilterPriority) tasks=tasks.filter(t=>t.priority===tlFilterPriority);

  // Buckets
  const overdue=[],h72=[],d7=[],d15=[],d30=[],noDate=[];

  tasks.forEach(t=>{
    const dt=parseDate(t.dueDate);
    if(!dt){ noDate.push(t); return; }
    if(dt<NOW)  { overdue.push(t); return; }
    if(dt<=D3)  { h72.push(t);    return; }
    if(dt<=D7)  { d7.push(t);     return; }
    if(dt<=D15) { d15.push(t);    return; }
    if(dt<=D30) { d30.push(t);    return; }
    noDate.push(t);
  });

  // Prioridade por cores
  const PMAP={'critica':'rgba(0,229,195,.12)','alta':'rgba(245,166,35,.1)','media':'rgba(59,130,246,.08)','baixa':'rgba(255,255,255,.04)'};
  const PBORDER={'critica':'rgba(0,229,195,.3)','alta':'rgba(245,166,35,.25)','media':'rgba(59,130,246,.2)','baixa':'var(--border)'};

  function tlCard(t){
    const isOverdue=t.dueDate && parseDate(t.dueDate)<NOW;
    const bg=PMAP[t.priority]||'rgba(255,255,255,.04)';
    const bd=PBORDER[t.priority]||'var(--border)';
    return `<div class="tl-card" style="background:${bg};border-color:${bd}">
      <div class="tl-card-name">${t.name}</div>
      <div class="tl-card-meta">
        ${t.client?`<span class="badge b-client" style="font-size:9px;padding:1px 6px">${t.client}</span>`:''}
        ${t.person?`<span class="badge b-person" style="font-size:9px;padding:1px 6px">${t.person}</span>`:''}
      </div>
      <div class="tl-card-foot">
        <span class="badge ${prioCls(t.priority)}" style="font-size:9px;padding:1px 5px">${prioLbl(t.priority)}</span>
        ${t.dueDate?`<span style="font-size:10px;font-weight:600;${isOverdue?'color:#f87171':'color:var(--muted2)'}">${isOverdue?'⚠ ':''}${fmtDate(t.dueDate)}</span>`:''}
      </div>
    </div>`;
  }

  function tlCol(title,tasks,topColor,label){
    const cards=tasks.length?tasks.map(tlCard).join(''):`<div class="tl-empty">Sem demandas</div>`;
    return `<div class="tl-col" style="border-top:3px solid ${topColor}">
      <div class="tl-col-head">
        <div>
          <div class="tl-col-title" style="color:${topColor}">${title}</div>
          ${label?`<div style="font-size:10px;color:var(--muted2);margin-top:1px">${label}</div>`:''}
        </div>
        <span class="tl-col-count">${tasks.length}</span>
      </div>
      <div class="tl-col-body">${cards}</div>
    </div>`;
  }

  // Filter options
  const allClients=[...new Set(allTasks().map(t=>t.client).filter(Boolean))].sort();
  const cOpts2=`<option value="">Todos clientes</option>`+allClients.map(c=>`<option value="${c}"${tlFilterClient===c?' selected':''}>${c}</option>`).join('');
  const pOpts2=`<option value="">Todas prioridades</option>`+PRIORITIES.map(p=>`<option value="${p.v}"${tlFilterPriority===p.v?' selected':''}>${p.lbl}</option>`).join('');
  const sOpts2=`<option value="">Todos status</option>
    <option value="pendente"${tlFilterStatus==='pendente'?' selected':''}>· Pendente</option>
    <option value="em andamento"${tlFilterStatus==='em andamento'?' selected':''}>⏳ Em andamento</option>`;

  const hasFilter=tlFilterClient||tlFilterStatus||tlFilterPriority;
  const totalVis=overdue.length+h72.length+d7.length+d15.length+d30.length+noDate.length;

  el.innerHTML=`
    <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:12px">
      <div>
        <h2 style="font-size:20px;font-weight:700;letter-spacing:-.02em">Roadmap Temporal</h2>
        <div style="font-size:12px;color:var(--muted2);margin-top:3px">Planejamento por prazo e prioridade · <b style="color:var(--cyan)">${totalVis}</b> demanda${totalVis!==1?'s':''} em aberto</div>
      </div>
      <div class="filter-bar" style="margin-bottom:0">
        <label>Filtrar</label>
        <select class="inp ${tlFilterClient?'filter-active':''}" style="width:130px" onchange="tlFilterClient=this.value;renderTimeline()">${cOpts2}</select>
        <select class="inp ${tlFilterPriority?'filter-active':''}" style="width:130px" onchange="tlFilterPriority=this.value;renderTimeline()">${pOpts2}</select>
        <select class="inp ${tlFilterStatus?'filter-active':''}" style="width:130px" onchange="tlFilterStatus=this.value;renderTimeline()">${sOpts2}</select>
        ${hasFilter?`<button class="btn xs danger" onclick="tlFilterClient='';tlFilterStatus='';tlFilterPriority='';renderTimeline()">✕ Limpar</button>`:''}
        <span class="filter-count"><b>${totalVis}</b> demanda${totalVis!==1?'s':''}</span>
      </div>
    </div>
    <div class="tl-scroll-wrap">
      <div class="tl-board">
        ${tlCol('🔥 OVERDUE',overdue,'#ef4444','Atrasadas')}
        ${tlCol('⚡ HOJE / 72H',h72,'#f59e0b','Prioridades imediatas')}
        ${tlCol('📅 PRÓXIMOS 7 DIAS',d7,'#3b82f6','Esta semana')}
        ${tlCol('📋 PRÓXIMOS 15 DIAS',d15,'var(--cyan)','Planejamento tático')}
        ${tlCol('🚀 PRÓXIMOS 30 DIAS',d30,'#22c55e','Planejamento estratégico')}
        ${tlCol('📌 SEM PRAZO',noDate,'var(--muted2)','Backlog / sem data')}
      </div>
    </div>`;
}

// ═══════════════════════════════════════════════════════════════
// PRIORITY MATRIX (Matriz de Eisenhower)
// ═══════════════════════════════════════════════════════════════
function initMatrix(){if(!S.matrix)S.matrix={};}

function renderMatrix(){
  const el=document.getElementById('view-matrix');
  if(!el)return;
  initMatrix();

  // Classify tasks into quadrants
  const q1=[],q2=[],q3=[],q4=[];
  Object.entries(S.matrix).forEach(([id,q])=>{
    const t=allTasks().find(x=>x.id===id);
    if(!t)return;
    if(q==='q1')q1.push(t);
    else if(q==='q2')q2.push(t);
    else if(q==='q3')q3.push(t);
    else if(q==='q4')q4.push(t);
  });

  // Filter options
  const allClients=[...new Set(allTasks().map(t=>t.client).filter(Boolean))].sort();
  const cOpts3=`<option value="">Todos clientes</option>`+allClients.map(c=>`<option value="${c}"${matrixFilterClient===c?' selected':''}>${c}</option>`).join('');

  // Card render
  function mxCard(t,q){
    const isDone=t.status==='concluido';
    return `<div class="mx-card" style="${isDone?'opacity:.45':''}">
      <div class="mx-card-name" style="${isDone?'text-decoration:line-through;color:var(--muted2)':''}">${t.name}</div>
      <div class="mx-card-meta">
        <div style="display:flex;gap:4px;flex-wrap:wrap;flex:1">
          ${t.client?`<span class="badge b-client" style="font-size:9px;padding:1px 6px">${t.client}</span>`:''}
          ${t.person?`<span class="badge b-person" style="font-size:9px;padding:1px 6px">${t.person}</span>`:''}
          <span class="badge ${prioCls(t.priority)}" style="font-size:9px;padding:1px 5px">${prioLbl(t.priority)}</span>
        </div>
        <div style="display:flex;gap:4px;margin-top:5px">
          <select class="inp" style="font-size:10px;padding:2px 5px;height:20px;background:rgba(255,255,255,.06)" onchange="moveTaskMatrix('${t.id}',this.value)">
            <option value="q1"${q==='q1'?' selected':''}>Q1 Fazer agora</option>
            <option value="q2"${q==='q2'?' selected':''}>Q2 Planejar</option>
            <option value="q3"${q==='q3'?' selected':''}>Q3 Delegar</option>
            <option value="q4"${q==='q4'?' selected':''}>Q4 Eliminar</option>
          </select>
          <button class="btn icon-btn" title="Remover da matriz" onclick="removeFromMatrix('${t.id}')" style="width:20px;height:20px">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:10px;height:10px"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>
      </div>
    </div>`;
  }

  function mxQuad(label,sub,tasks,q,color,icon){
    const cards=tasks.length?tasks.map(t=>mxCard(t,q)).join(''):`<div class="mx-empty">Arraste ou adicione tarefas aqui</div>`;
    return `<div class="mx-quad ${q}">
      <div class="mx-quad-head">
        <div>
          <div class="mx-quad-title" style="color:${color}">${icon} ${label}</div>
          <div class="mx-quad-sub">${sub}</div>
        </div>
        <span class="mx-quad-cnt">${tasks.length}</span>
      </div>
      ${cards}
      <button class="mx-add-btn" onclick="openAddToMatrix('${q}')">+ Adicionar tarefa</button>
    </div>`;
  }

  el.innerHTML=`
    <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:1.25rem;flex-wrap:wrap;gap:12px">
      <div>
        <h2 style="font-size:20px;font-weight:700;letter-spacing:-.02em">Matriz de Prioridades</h2>
        <div style="font-size:12px;color:var(--muted2);margin-top:3px">Matriz de Eisenhower · organize por urgência × importância</div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <select class="inp ${matrixFilterClient?'filter-active':''}" style="width:140px" onchange="matrixFilterClient=this.value;renderMatrix()">${cOpts3}</select>
        <button class="btn cy sm" onclick="openAddToMatrix('')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:13px;height:13px"><path d="M12 5v14M5 12h14"/></svg>
          Adicionar tarefa
        </button>
        ${Object.keys(S.matrix).length?`<button class="btn danger sm" onclick="clearMatrix()">🗑 Limpar matriz</button>`:''}
      </div>
    </div>

    <!-- axis labels top -->
    <div style="display:grid;grid-template-columns:56px 1fr 1fr;gap:0;margin-bottom:0">
      <div></div>
      <div style="text-align:center;padding:8px;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#ef4444;border-bottom:2px solid #ef4444;margin:0 2px 4px">🔴 URGENTE</div>
      <div style="text-align:center;padding:8px;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#3b82f6;border-bottom:2px solid #3b82f6;margin:0 2px 4px">🔵 NÃO URGENTE</div>
    </div>

    <div style="display:grid;grid-template-columns:56px 1fr 1fr;gap:0">
      <!-- side labels -->
      <div style="display:grid;grid-template-rows:1fr 1fr;gap:8px;padding:0 4px 0 0">
        <div style="display:flex;align-items:center;justify-content:center">
          <span style="writing-mode:vertical-rl;text-orientation:mixed;transform:rotate(180deg);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#22c55e;white-space:nowrap">🟢 IMPORTANTE</span>
        </div>
        <div style="display:flex;align-items:center;justify-content:center">
          <span style="writing-mode:vertical-rl;text-orientation:mixed;transform:rotate(180deg);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted2);white-space:nowrap">⚫ NÃO IMPORTANTE</span>
        </div>
      </div>
      <!-- quadrants grid -->
      <div style="display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto;gap:8px;grid-column:2/-1">
        ${mxQuad('FAZER AGORA','Urgente + Importante',q1,'q1','#ef4444','🔥')}
        ${mxQuad('PLANEJAR','Não urgente + Importante',q2,'q2','#22c55e','📅')}
        ${mxQuad('DELEGAR','Urgente + Não importante',q3,'q3','#f59e0b','👥')}
        ${mxQuad('ELIMINAR','Não urgente + Não importante',q4,'q4','var(--muted2)','🗑')}
      </div>
    </div>`;
}

function moveTaskMatrix(taskId,quadrant){
  initMatrix();
  S.matrix[taskId]=quadrant;
  persist();
  // update only the selects without full re-render
}

function removeFromMatrix(taskId){
  initMatrix();
  delete S.matrix[taskId];
  persist();
  renderMatrix();
}

function clearMatrix(){
  if(!confirm('Limpar toda a matriz? As tarefas não serão excluídas.'))return;
  S.matrix={};
  persist();
  renderMatrix();
  toast('Matriz limpa.');
}

function openAddToMatrix(defaultQuad){
  initMatrix();
  const inMatrix=new Set(Object.keys(S.matrix));
  const allTs=allTasks().filter(t=>!inMatrix.has(t.id) && t.status!=='concluido');
  if(!allTs.length){toast('Nenhuma tarefa em aberto fora da matriz!');return;}

  // Sort by client then name
  const sorted=[...allTs].sort((a,b)=>(a.client||'').localeCompare(b.client||'')||(a.name.localeCompare(b.name)));
  const taskOpts=sorted.map(t=>{
    const cli=t.client?`[${t.client}] `:'';
    const st=t.status==='em andamento'?'⏳ ':'· ';
    return `<option value="${t.id}">${st}${cli}${t.name}</option>`;
  }).join('');

  showModal(`
    <div class="drawer-head">
      <h3>Adicionar à Matriz</h3>
      <button class="btn icon-btn ghost" onclick="closeModal()">${SVG_CLOSE}</button>
    </div>
    <div class="drawer-body">
      <div class="frow">
        <label>Tarefa</label>
        <select class="inp" id="mx-task-sel" style="width:100%">${taskOpts}</select>
      </div>
      <div class="frow">
        <label>Quadrante</label>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px" id="mx-quad-opts">
          ${[
            {v:'q1',lbl:'🔥 Fazer agora',sub:'Urgente + Importante',col:'#ef4444'},
            {v:'q2',lbl:'📅 Planejar',sub:'Não urgente + Importante',col:'#22c55e'},
            {v:'q3',lbl:'👥 Delegar',sub:'Urgente + Não importante',col:'#f59e0b'},
            {v:'q4',lbl:'🗑 Eliminar',sub:'Não urgente + Não importante',col:'var(--muted2)'}
          ].map(q=>`
            <div onclick="selectMxQuad('${q.v}')" id="mxq-${q.v}"
              style="padding:10px 12px;border:1.5px solid ${defaultQuad===q.v?q.col:'var(--border2)'};border-radius:8px;cursor:pointer;transition:all .15s;background:${defaultQuad===q.v?'rgba(255,255,255,.06)':'transparent'}">
              <div style="font-size:12px;font-weight:600;color:${q.col}">${q.lbl}</div>
              <div style="font-size:10px;color:var(--muted2);margin-top:2px">${q.sub}</div>
            </div>`).join('')}
        </div>
        <input type="hidden" id="mx-quad-val" value="${defaultQuad||'q1'}">
      </div>
    </div>
    <div class="drawer-foot">
      <div class="spacer"></div>
      <button class="btn" onclick="closeModal()">Cancelar</button>
      <button class="btn cy" onclick="saveToMatrix()">Adicionar</button>
    </div>`);
  // highlight default
  if(defaultQuad) selectMxQuad(defaultQuad);
  else selectMxQuad('q1');
}

function selectMxQuad(v){
  const COLORS={q1:'#ef4444',q2:'#22c55e',q3:'#f59e0b',q4:'var(--muted2)'};
  ['q1','q2','q3','q4'].forEach(q=>{
    const el=document.getElementById('mxq-'+q);
    if(!el)return;
    if(q===v){
      el.style.borderColor=COLORS[q];
      el.style.background='rgba(255,255,255,.06)';
    }else{
      el.style.borderColor='var(--border2)';
      el.style.background='transparent';
    }
  });
  const inp=document.getElementById('mx-quad-val');
  if(inp)inp.value=v;
}

function saveToMatrix(){
  const taskId=document.getElementById('mx-task-sel').value;
  const quad=document.getElementById('mx-quad-val').value;
  if(!taskId||!quad){toast('⚠ Selecione uma tarefa e um quadrante');return;}
  initMatrix();
  S.matrix[taskId]=quad;
  persist();
  closeModal();
  renderMatrix();
  toast('✅ Tarefa adicionada à matriz!');
}

  const PRIO_C={'Alta':CY,'Media':CYD,'Baixa':G3};

  // ── READ FORM (snapshot at call time) ────────────────────────
  function rv(id){const el=document.getElementById(id);return el?el.value.trim():'';}
  const client   = rv('rg-client')  ||RG.selectedClient||'Cliente';
  const project  = rv('rg-project') ||'';
  const period2  = rv('rg-period')  ||'';
  const dateVal  = rv('rg-date')    ||todayISO();
  const resp     = rv('rg-resp')    ||'';
  const version  = rv('rg-version') ||'v1.0';
  const company  = rv('rg-company') ||'Sete Company Tecnologia';
  const execCmt  = rv('rg-execcomment')||'';
  const closing  = rv('rg-closing') ||'';

  // ── HELPERS ───────────────────────────────────────────────────
  let y=0;
  function sf(sz,st,col){doc.setFontSize(sz);doc.setFont('helvetica',st||'normal');doc.setTextColor(...(col||G5));}
  function fill(col){doc.setFillColor(...col);}
  function stroke(col,w){doc.setDrawColor(...col);doc.setLineWidth(w||.2);}

  function newPage(){
    doc.addPage();
    fill(W);doc.rect(0,0,PW,PH,'F');
    y=M+2;
    pageFooter();
  }
  function guard(h){if(y+(h||20)>PH-16)newPage();}

  function pageFooter(){
    const pg=doc.internal.getCurrentPageInfo().pageNumber;
    stroke(G2,.2); doc.line(M,PH-11,PW-M,PH-11);
    // small logo in footer
    const fLW=28, fLH=fLW/3.132;
    doc.addImage(LOGO_B64,'PNG',M,PH-10,fLW,fLH);
    sf(6.5,'normal',G3);
    doc.text(`${version}  ·  ${fmtDate(dateVal)}  ·  Pág. ${pg}`,PW-M,PH-6.5,{align:'right'});
  }

  // Section header — dark band, white text, cyan left accent
  function secHeader(title){
    guard(16);
    y+=5;
    const BAND_H=10;
    fill(BK2);doc.rect(M,y,CW,BAND_H,'F');
    fill(CY);doc.rect(M,y,3,BAND_H,'F');
    sf(7.5,'bold',W);
    // baseline at exact vertical center of band
    doc.text(title.toUpperCase(),M+7,y+6.8);
    y+=BAND_H+4;
  }

  // ── MANUAL TABLE ──────────────────────────────────────────────
  // cols: [{label, w}]   w in mm (sum = CW)
  // rows: array of row-objects {cells:[...], desc:''}
  //   cells maps 1-to-1 with cols
  //   type per col: 'text'|'prio'|'status'
  function drawTable(title, colDefs, rows){
    if(!rows.length)return;
    secHeader(title);
    const HEAD_H=7, ROW_H=10;

    const totalW=colDefs.reduce((s,c)=>s+c.w,0);
    const ws=colDefs.map(c=>parseFloat((c.w/totalW*CW).toFixed(2)));

    // header
    guard(HEAD_H+2);
    fill(G1);doc.rect(M,y,CW,HEAD_H,'F');
    stroke(CY,.35);doc.line(M,y+HEAD_H,PW-M,y+HEAD_H);
    let hx=M;
    colDefs.forEach((c,i)=>{
      sf(6,'bold',G3);
      doc.text(c.label.toUpperCase(),hx+2.5,y+HEAD_H/2+1.2);
      hx+=ws[i];
    });
    y+=HEAD_H;

    rows.forEach((row,ri)=>{
      // pre-calculate desc lines to get exact height
      const rawDesc=(row.desc||'').trim();
      let descLines=[];
      if(rawDesc){
        descLines=doc.splitTextToSize(rawDesc,CW-6);
        if(descLines.length>3) descLines=descLines.slice(0,3);
      }
      const hasDesc=descLines.length>0;
      const DESC_BLOCK=hasDesc?(descLines.length*4.5+4):0;
      const rh=ROW_H+DESC_BLOCK;

      guard(rh+1);

      // alt background
      if(ri%2===0){fill([250,251,254]);doc.rect(M,y,CW,rh,'F');}

      // ── data cells — vertically centered in ROW_H ──
      const midY=y+ROW_H/2+1.2; // vertical center of the data row
      let rx=M;
      row.cells.forEach((val,ci)=>{
        const t=colDefs[ci].type||'text';
        const cx2=rx+2.5;
        if(t==='prio'){
          const col2=PRIO_C[val]||G3;
          fill(col2);doc.circle(cx2+1.3,midY-.3,1.3,'F');
          sf(7.5,'bold',col2);doc.text(String(val||''),cx2+5,midY+.9);
        } else if(t==='status'){
          const col2=STAT_C[val]||G3;
          fill(col2);doc.circle(cx2+1.3,midY-.3,1.4,'F');
          sf(7.5,'bold',col2);doc.text(String(val||''),cx2+5,midY+.9);
        } else {
          sf(ci===0?8:7.5,ci===0?'bold':'normal',ci===0?G5:G4);
          const lines=doc.splitTextToSize(String(val||''),ws[ci]-5);
          doc.text(lines[0]||'',cx2,midY+.9);
        }
        rx+=ws[ci];
      });

      // ── description block — directly below data row ──
      if(hasDesc){
        const dy=y+ROW_H+1;
        sf(6.5,'normal',G3);
        // left indent to align with first column text
        doc.text(descLines,M+3,dy+3.5);
      }

      // row separator
      stroke(G2,.12);doc.line(M,y+rh,PW-M,y+rh);
      y+=rh;
    });
    y+=5;
  }

  // ═══════════════════════════════════════════════════════════
  // COVER — white, minimal, light
  // ═══════════════════════════════════════════════════════════
  fill(W);doc.rect(0,0,PW,PH,'F');
  // top cyan bar
  fill(CY);doc.rect(0,0,PW,4,'F');

  // ── LOGO — real PNG, above client name ──
  const LOGO_RATIO=3.132;
  const LOGO_W=65, LOGO_H=LOGO_W/LOGO_RATIO;
  doc.addImage(LOGO_B64,'PNG',M,10,LOGO_W,LOGO_H);

  // client — large
  sf(44,'bold',BK);
  const clines=doc.splitTextToSize(client,CW);
  doc.text(clines,M,68);
  const clH=clines.length*16;

  // project
  if(project){sf(13,'normal',G3);doc.text(project,M,68+clH+3);}

  // meta divider
  stroke(G2,.25);doc.line(M,113,PW-M,113);

  // meta row
  const meta=[
    {k:'Período',v:period2},{k:'Emissão',v:fmtDate(dateVal)},
    {k:'Responsável',v:resp},{k:'Versão',v:version}
  ].filter(m=>m.v);
  const mW=CW/Math.max(meta.length,1);
  meta.forEach((m,i)=>{
    const mx=M+i*mW;
    sf(6.5,'normal',G3);doc.text(m.k.toUpperCase(),mx,124);
    sf(9.5,'bold',BK);doc.text(m.v,mx,133);
  });

  // exec comment — ONLY on cover
  if(execCmt){
    stroke(G2,.25);doc.line(M,146,PW-M,146);
    sf(6.5,'bold',CYD);doc.text('SÍNTESE EXECUTIVA',M,156);
    sf(8.5,'normal',G4);
    const ecL=doc.splitTextToSize(execCmt,CW);
    doc.text(ecL.slice(0,6),M,164);
  }

  // cover footer
  stroke(G2,.2);doc.line(M,PH-16,PW-M,PH-16);
  sf(7,'normal',G3);
  doc.text(`${company}  ·  ${fmtDate(dateVal)}  ·  ${version}`,M,PH-9);
  doc.text('Confidencial',PW-M,PH-9,{align:'right'});

  // ═══════════════════════════════════════════════════════════
  // BODY — starts on page 2
  // ═══════════════════════════════════════════════════════════
  newPage();

  // ── INDICATORS ──
  const inds=RG.indicators.filter(i=>(i.l||'').trim()&&(i.v||'').trim());
  if(inds.length){
    secHeader('Indicadores do Período');
    guard(32);
    const CARD_H=28, gap=4;
    const iW=(CW-(inds.length-1)*gap)/inds.length;
    const startY=y;
    inds.forEach((ind,i)=>{
      const ix=M+i*(iW+gap);
      // card background
      fill(G1);
      doc.roundedRect(ix,startY,iW,CARD_H,2,2,'F');
      // cyan bottom accent
      fill(CY);
      doc.rect(ix,startY+CARD_H-1.5,iW,1.5,'F');
      // value — large, centered
      sf(20,'bold',CY);
      doc.text(String(ind.v).trim(), ix+iW/2, startY+17, {align:'center'});
      // label — small, centered, truncated
      sf(5.5,'normal',G3);
      const lbl=doc.splitTextToSize(String(ind.l).trim().toUpperCase(), iW-4);
      doc.text(lbl[0]||'', ix+iW/2, startY+CARD_H-4, {align:'center'});
    });
    y=startY+CARD_H+6;
  }

  // ── ACTIVITIES ──
  if(RG.activities.length){
    drawTable('Atividades Realizadas',
      [{label:'Atividade',w:55},{label:'Prioridade',w:22,type:'prio'},{label:'Status',w:30,type:'status'},{label:'Data',w:17},{label:'Responsável',w:26}],
      RG.activities.map(a=>({
        cells:[a.title||'', a.prio||'Media', a.status||'Em andamento', a.date?fmtDate(a.date):'', a.resp||''],
        desc: a.obs||''
      }))
    );
  }

  // ── PLANNED ──
  if(RG.planned.length){
    drawTable('Próximas Entregas',
      [{label:'Entrega',w:55},{label:'Prioridade',w:22,type:'prio'},{label:'Status',w:30,type:'status'},{label:'Previsão',w:17},{label:'Responsável',w:26}],
      RG.planned.map(a=>({
        cells:[a.title||'', a.prio||'Media', a.status||'Planejado', a.date?fmtDate(a.date):'', a.resp||''],
        desc: a.obs||''
      }))
    );
  }

  // ── PENDING ──
  if(RG.pending.length){
    secHeader('Pendências do Cliente');
    RG.pending.forEach(p=>{
      guard(16);
      fill(CY);doc.circle(M+2,y+5.5,1.5,'F');
      sf(8.5,'bold',G5);
      doc.text(doc.splitTextToSize(p.title||'',CW-42)[0]||'',M+6.5,y+6.5);
      sf(7,'normal',G3);
      if(p.date)doc.text('Prazo: '+fmtDate(p.date),M+6.5,y+12);
      sf(6.5,'bold',CYD);
      doc.text((p.type||'Outro').toUpperCase(),PW-M,y+6.5,{align:'right'});
      stroke(G2,.12);doc.line(M,y+15,PW-M,y+15);
      y+=17;
    });
    y+=4;
  }

  // ── NEXT STEPS ──
  if(RG.nextsteps.length){
    drawTable('Próximos Passos',
      [{label:'#',w:8},{label:'Ação',w:88},{label:'Responsável',w:42},{label:'Previsão',w:12}],
      RG.nextsteps.map((n,i)=>({
        cells:[String(i+1),n.title||'',n.resp||'',n.date?fmtDate(n.date):''],
        desc:''
      }))
    );
  }

  // ── CLOSING ──
  if(closing){
    secHeader('Nota de Encerramento');
    const cl=doc.splitTextToSize(closing,CW-8);
    const bH=cl.length*4.8+10; guard(bH+4);
    fill(G1);doc.roundedRect(M,y,CW,bH,2,2,'F');
    stroke(CY,.2);doc.roundedRect(M,y,CW,bH,2,2,'S');
    sf(8.5,'italic',G4);doc.text(cl,M+5,y+7);
    y+=bH+6;
  }

  const fname=`report-${(client||'cliente').toLowerCase().replace(/\s+/g,'-')}-${(period2||isoDate()).replace(/\s+/g,'-')}.pdf`;
  doc.save(fname);
  toast(`PDF gerado: ${fname}`);
}



// ═══════════════════════════════════════════════════════════════
// PDF GENERATION — Relatório Executivo (redesign 2026)
// ═══════════════════════════════════════════════════════════════
function generatePDF(){
  if(typeof window.jspdf==='undefined'){toast('Carregando biblioteca PDF... tente novamente em 2s.');return;}
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:'mm',format:'a4',orientation:'portrait'});
  const rv=id=>{const e=document.getElementById(id);return e?e.value.trim():'';};

  const PW=210,PH=297,M=16,CW=PW-M*2;
  let y=0,pageNum=0,secNum=1;

  // ── PALETTE ──────────────────────────────────────────────────
  const W  =[255,255,255];
  const BK =[12,12,15];
  const GY1=[248,249,250];
  const GY2=[229,231,235];
  const GY3=[156,163,175];
  const GY4=[75,85,99];
  const GY5=[17,24,39];
  const GRN=[34,197,94];
  const AMB=[245,158,11];
  const RED=[239,68,68];

  const STAT_C={
    'Concluído':GRN,'Concluido':GRN,'Em andamento':AMB,'Em aberto':AMB,
    'Pendente':RED,'Cancelado':GY3,'Planejado':GY4,'Bloqueado':RED,'Aguardando cliente':AMB
  };
  const PRIO_C={'Alta':RED,'Media':AMB,'Média':AMB,'Baixa':GRN};

  // ── FORM VALUES ──────────────────────────────────────────────
  const client  =rv('rg-client')||RG.selectedClient||'Cliente';
  const project =rv('rg-project')||'';
  const period2 =rv('rg-period')||'';
  const dateVal =rv('rg-date')||todayISO();
  const resp    =rv('rg-resp')||'';
  const version =rv('rg-version')||'v1.0';
  const company =rv('rg-company')||'Sete Company Tecnologia';
  const execCmt =rv('rg-execcomment')||'';
  const closing =rv('rg-closing')||'';

  // ── HELPERS ──────────────────────────────────────────────────
  function sf(sz,st,col){doc.setFontSize(sz);doc.setFont('helvetica',st||'normal');doc.setTextColor(...(col||GY5));}
  function fill(col){doc.setFillColor(...col);}
  function stroke(col,w){doc.setDrawColor(...col);doc.setLineWidth(w||0.2);}
  function diamond(cx,cy,s,col){
    fill(col||BK);
    doc.lines([[s,s],[s,-s],[-s,-s],[-s,s]],cx-s,cy,[1,1],'F');
  }

  // ── PAGE HEADER (interior) ────────────────────────────────────
  function pageHeader(){
    fill(BK);doc.rect(0,0,PW,1.8,'F');
    diamond(M-3,8.5,3,BK);
    sf(7.5,'bold',GY5);doc.text(company,M+3,9.5);
    sf(7,'normal',GY3);
    doc.text('Relatório Executivo'+(period2?' | '+period2:''),PW-M,9.5,{align:'right'});
    y=20;
  }

  // ── PAGE FOOTER ──────────────────────────────────────────────
  function pageFooter(){
    stroke(GY2,0.3);doc.line(M,PH-13,PW-M,PH-13);
    sf(7,'normal',GY3);doc.text(company,M,PH-7);
    sf(7.5,'bold',GY4);doc.text(String(pageNum),PW-M,PH-7,{align:'right'});
  }

  function newPage(){
    doc.addPage();pageNum++;
    fill(W);doc.rect(0,0,PW,PH,'F');
    pageHeader();pageFooter();
  }
  function guard(h){if(y+(h||20)>PH-22)newPage();}

  // ── SECTION TITLE ────────────────────────────────────────────
  function sectionTitle(title){
    secNum++;
    guard(42);
    sf(13,'normal',GY2);doc.text(String(secNum).padStart(2,'0'),M,y+11);
    sf(22,'bold',GY5);doc.text(title,M,y+25);
    y+=36;
    stroke(GY2,0.4);doc.line(M,y,PW-M,y);
    y+=9;
  }

  // ── TABLE ────────────────────────────────────────────────────
  function drawTable2(colDefs,rows,footnote){
    if(!rows.length)return;
    const HEAD_H=8.5,ROW_H=9;
    const totalW=colDefs.reduce((s,c)=>s+c.w,0);
    const ws=colDefs.map(c=>parseFloat((c.w/totalW*CW).toFixed(2)));
    guard(HEAD_H+ROW_H+2);
    fill(GY5);doc.rect(M,y,CW,HEAD_H,'F');
    let hx=M;
    colDefs.forEach((c,i)=>{
      sf(6.5,'bold',W);doc.text(c.label.toUpperCase(),hx+3,y+5.8);
      hx+=ws[i];
    });
    y+=HEAD_H;
    rows.forEach((row,ri)=>{
      const dl=(row.desc||'').trim();
      const dLines=dl?doc.splitTextToSize(dl,CW-6).slice(0,3):[];
      const rh=ROW_H+(dLines.length?dLines.length*4+3:0);
      guard(rh+1);
      if(ri%2===0){fill(GY1);doc.rect(M,y,CW,rh,'F');}
      const midY=y+ROW_H/2+1.5;
      let rx=M;
      row.cells.forEach((val,ci)=>{
        const t=colDefs[ci].type||'text';
        if(t==='status'){sf(7.5,'bold',STAT_C[val]||GY4);doc.text(String(val||''),rx+3,midY+0.5);}
        else if(t==='prio'){sf(7.5,'bold',PRIO_C[val]||GY4);doc.text(String(val||''),rx+3,midY+0.5);}
        else if(t==='pct'){
          const pct=Math.min(100,Math.max(0,parseInt(val)||0));
          const bw=ws[ci]-18;
          stroke(GY2,0.3);doc.rect(rx+3,midY-2.5,bw,3,'S');
          if(pct>0){fill(pct>=100?GRN:pct>=50?AMB:RED);doc.rect(rx+3,midY-2.5,bw*pct/100,3,'F');}
          sf(6.5,'bold',GY4);doc.text(pct+'%',rx+3+bw+2,midY+0.5);
        }else{
          sf(ci===0?8:7.5,ci===0?'bold':'normal',ci===0?GY5:GY4);
          doc.text((doc.splitTextToSize(String(val||''),ws[ci]-5))[0]||'',rx+3,midY+0.5);
        }
        rx+=ws[ci];
      });
      if(dLines.length){sf(6.5,'normal',GY3);doc.text(dLines,M+3,y+ROW_H+2.5);}
      stroke(GY2,0.12);doc.line(M,y+rh,PW-M,y+rh);
      y+=rh;
    });
    if(footnote){y+=4;sf(7,'normal',GY3);doc.text('(i)  '+footnote,M,y);y+=7;}
    else y+=5;
  }

  // ════════════════════════════════════════════════════════════
  // COVER (PAGE 1)
  // ════════════════════════════════════════════════════════════
  pageNum=1;
  fill(BK);doc.rect(0,0,PW,PH,'F');
  // Decorative circles bottom-right
  fill([20,20,24]);doc.circle(PW+30,PH+12,115,'F');
  fill([16,16,20]);doc.circle(PW+6,PH-28,90,'F');
  fill([26,26,32]);doc.circle(PW-24,PH+32,72,'F');
  // Logo + company top-left
  diamond(M,14,4,W);
  sf(9,'bold',W);doc.text(company,M+8,15.5);
  // Title
  sf(46,'bold',W);
  doc.text('Relatório',M,133);
  doc.text('Executivo',M,161);
  // Accent line
  fill(W);doc.rect(M,168,32,1.2,'F');
  // Subtitle
  sf(10,'normal',[175,180,192]);
  doc.text('Visão geral de atividades, indicadores',M,179);
  doc.text('e entregas',M,186);
  // Meta
  stroke([42,42,52],0.3);doc.line(M,PH-30,68,PH-30);
  sf(8.5,'bold',[195,200,212]);doc.text(period2||fmtDate(dateVal),M,PH-22);
  sf(7.5,'normal',[115,120,132]);doc.text(client,M,PH-15);
  // Footer
  stroke([32,32,42],0.3);doc.line(M,PH-7,PW-M,PH-7);
  sf(6.5,'normal',[95,100,112]);doc.text('Confidencial',PW-M,PH-2,{align:'right'});

  // ════════════════════════════════════════════════════════════
  // PAGE 2 — SUMÁRIO EXECUTIVO
  // ════════════════════════════════════════════════════════════
  newPage();sectionTitle('Sumário Executivo');
  // Status cards
  sf(8.5,'bold',GY5);doc.text('Status Geral',M,y);y+=10;
  const cards3=[
    {lbl:'Saudável', desc:'Tudo dentro do esperado',      col:GRN,sel:RG.semaphore==='green'},
    {lbl:'Atenção',  desc:'Alguns pontos de atenção',     col:AMB,sel:RG.semaphore==='yellow'||RG.semaphore==='orange'},
    {lbl:'Crítico',  desc:'Ações corretivas necessárias', col:RED,sel:RG.semaphore==='red'||RG.semaphore==='black'},
  ];
  const cw3=(CW-8)/3;
  cards3.forEach((c3,i)=>{
    const sx=M+i*(cw3+4);
    fill(c3.sel?c3.col:GY1);doc.roundedRect(sx,y,cw3,22,2,2,'F');
    stroke(c3.sel?c3.col:GY2,0.4);doc.roundedRect(sx,y,cw3,22,2,2,'S');
    fill(c3.sel?W:c3.col);doc.circle(sx+7,y+8,2.8,'F');
    sf(8.5,'bold',c3.sel?W:GY5);doc.text(c3.lbl,sx+14,y+9.5);
    sf(7,'normal',c3.sel?[220,240,235]:GY3);doc.text(c3.desc,sx+14,y+16);
  });
  y+=30;
  if(execCmt){
    guard(12);sf(8.5,'normal',GY4);
    const ecL=doc.splitTextToSize(execCmt,CW);
    doc.text(ecL.slice(0,8),M,y);y+=ecL.slice(0,8).length*5+6;
  }
  const highlights=RG.activities.filter(a=>a.obs).slice(0,5);
  if(highlights.length){
    guard(16);sf(9,'bold',GY5);doc.text('Destaques do Período',M,y);y+=9;
    highlights.forEach(a=>{
      guard(8);fill(GY5);doc.circle(M+2,y-0.8,1.5,'F');
      sf(8,'normal',GY4);
      doc.text((doc.splitTextToSize(a.obs,CW-9))[0]||'',M+7,y);y+=6.5;
    });
  }

  // ════════════════════════════════════════════════════════════
  // PAGE 3 — TAREFAS DO PERÍODO
  // ════════════════════════════════════════════════════════════
  const allPeriodTasks=[...RG.activities,...RG.planned];
  if(allPeriodTasks.length){
    newPage();sectionTitle('Tarefas do Período');
    drawTable2(
      [{label:'Tarefa',w:55},{label:'Responsável',w:28},{label:'Status',w:30,type:'status'},{label:'Prazo',w:17},{label:'Conclusão',w:22,type:'pct'}],
      allPeriodTasks.map(a=>({
        cells:[a.title||'',a.resp||'',a.status||'Pendente',a.date?fmtDate(a.date):'—',
               (a.status==='Concluído'||a.status==='Concluido')?'100':a.status==='Em andamento'?'50':'0'],
        desc:''
      }))
    );
    [[' Concluído',GRN],[' Em andamento',AMB],[' Pendente',RED]].forEach(([lbl,col],i)=>{
      fill(col);doc.circle(M+i*42+2,y-1,2,'F');
      sf(7.5,'normal',GY4);doc.text(lbl,M+i*42+5.5,y);
    });y+=8;
  }

  // ════════════════════════════════════════════════════════════
  // PAGE 4 — ATIVIDADES REALIZADAS
  // ════════════════════════════════════════════════════════════
  if(RG.activities.length){
    newPage();sectionTitle('Atividades Realizadas');
    RG.activities.forEach((a,idx)=>{
      const dl=a.obs?doc.splitTextToSize(a.obs,CW-17).slice(0,3):[];
      const bH=Math.max(20,17+dl.length*4.5)+5;
      guard(bH);
      fill(GY1);doc.roundedRect(M,y,13,13,2,2,'F');
      sf(9,'bold',GY5);doc.text(String(idx+1),M+6.5,y+9,{align:'center'});
      sf(9,'bold',GY5);doc.text(a.title||'',M+17,y+7);
      sf(7,'normal',GY3);doc.text((a.cat||'')+(a.resp?' · '+a.resp:''),M+17,y+12.5);
      if(dl.length){sf(7.5,'normal',GY4);dl.forEach((l,li)=>doc.text(l,M+17,y+18+li*4.5));y+=17+dl.length*4.5+5;}
      else y+=20;
      if(idx<RG.activities.length-1){stroke(GY2,0.2);doc.line(M+17,y-2,PW-M,y-2);}
    });
  }

  // ════════════════════════════════════════════════════════════
  // PAGE 5 — PRÓXIMAS ENTREGAS
  // ════════════════════════════════════════════════════════════
  if(RG.planned.length){
    newPage();sectionTitle('Próximas Entregas');
    const STCOLMAP={'Concluído':GRN,'Em andamento':AMB,'Pendente':RED,'Planejado':GY3,'Bloqueado':RED,'Aguardando cliente':AMB};
    RG.planned.forEach((p,idx)=>{
      const hasDesc=p.obs&&p.obs.trim();
      const lineH=hasDesc?22:16;
      guard(lineH);
      const dotC=STCOLMAP[p.status]||GY3;
      if(idx<RG.planned.length-1){stroke(GY2,0.5);doc.line(M+4,y+7,M+4,y+lineH+2);}
      fill(dotC);doc.circle(M+4,y+5,3.5,'F');
      sf(9,'bold',GY5);doc.text(p.title||'',M+14,y+6.5);
      sf(7.5,'bold',dotC);doc.text(p.status||'',M+14,y+12.5);
      if(p.date){sf(7,'normal',GY3);doc.text(fmtDate(p.date),PW-M,y+6.5,{align:'right'});}
      if(p.resp){sf(7,'normal',GY3);doc.text(p.resp,PW-M,y+12.5,{align:'right'});}
      if(hasDesc){sf(7,'normal',GY3);doc.text((doc.splitTextToSize(p.obs,CW-14))[0]||'',M+14,y+18.5);y+=22;}
      else y+=16;
    });
    y+=4;sf(7,'normal',GY3);
    doc.text('ⓘ  Datas sujeitas a alterações conforme andamento das atividades e validações.',M,y);y+=8;
  }

  // ════════════════════════════════════════════════════════════
  // PAGE 6 — PENDÊNCIAS DO CLIENTE
  // ════════════════════════════════════════════════════════════
  if(RG.pending.length){
    newPage();sectionTitle('Pendências do Cliente');
    drawTable2(
      [{label:'Pendência',w:58},{label:'Responsável',w:22},{label:'Prazo',w:20},{label:'Tipo',w:22},{label:'Status',w:22,type:'status'}],
      RG.pending.map(p=>({
        cells:[p.title||'','Cliente',p.date?fmtDate(p.date):'—',p.type||'Outro','Em aberto'],desc:''
      })),
      'Atrasos nas pendências do cliente podem impactar o cronograma das entregas.'
    );
  }

  // ════════════════════════════════════════════════════════════
  // PAGE 7 — INDICADORES (KPIs)
  // ════════════════════════════════════════════════════════════
  const inds=RG.indicators.filter(i=>(i.l||'').trim()&&(i.v||'').trim());
  if(inds.length){
    newPage();sectionTitle('Indicadores (KPIs)');
    const gap=6,CARD_H=44;
    const iW=(CW-gap*(inds.length-1))/inds.length;
    inds.forEach((ind,i)=>{
      const ix=M+i*(iW+gap);
      fill(GY1);doc.roundedRect(ix,y,iW,CARD_H,3,3,'F');
      stroke(GY2,0.3);doc.roundedRect(ix,y,iW,CARD_H,3,3,'S');
      fill(GRN);doc.rect(ix,y,iW,1.8,'F');
      sf(22,'bold',GY5);doc.text(String(ind.v).trim(),ix+iW/2,y+27,{align:'center'});
      sf(6,'normal',GY3);
      doc.text((doc.splitTextToSize(String(ind.l).trim().toUpperCase(),iW-6))[0]||'',ix+iW/2,y+CARD_H-5,{align:'center'});
    });
    y+=CARD_H+8;
    sf(7,'normal',GY3);
    doc.text('ⓘ  Os indicadores refletem o desempenho do período'+(period2?' de '+period2:'')+'.', M,y);
  }

  // ════════════════════════════════════════════════════════════
  // PRÓXIMOS PASSOS
  // ════════════════════════════════════════════════════════════
  if(RG.nextsteps.length){
    guard(40);sectionTitle('Próximos Passos');
    drawTable2(
      [{label:'#',w:8},{label:'Ação',w:90},{label:'Responsável',w:40},{label:'Previsão',w:14}],
      RG.nextsteps.map((n,i)=>({cells:[String(i+1),n.title||'',n.resp||'',n.date?fmtDate(n.date):'—'],desc:''}))
    );
  }

  // ════════════════════════════════════════════════════════════
  // NOTA DE ENCERRAMENTO
  // ════════════════════════════════════════════════════════════
  if(closing){
    guard(40);sectionTitle('Nota de Encerramento');
    const cl=doc.splitTextToSize(closing,CW-10).slice(0,6);
    const bH=cl.length*5+12;
    fill(GY1);doc.roundedRect(M,y,CW,bH,2,2,'F');
    stroke(GY2,0.3);doc.roundedRect(M,y,CW,bH,2,2,'S');
    sf(8.5,'italic',GY4);doc.text(cl,M+6,y+8);
    y+=bH+8;
  }

  const fname=`report-${(client||'cliente').toLowerCase().replace(/\s+/g,'-')}-${(period2||isoDate()).replace(/\s+/g,'-')}.pdf`;
  doc.save(fname);
  toast(`PDF gerado: ${fname}`);
}

function hexToRgb(hex){
  const r=parseInt(hex.slice(1,3),16);
  const g=parseInt(hex.slice(3,5),16);
  const b=parseInt(hex.slice(5,7),16);
  return{r,g,b};
}
