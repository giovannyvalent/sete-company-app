<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sete Company — Worklists</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07090f;--bg1:#0d1017;--bg2:#131720;--bg3:#1a2030;--bg4:#212840;
  --border:#1e2535;--border2:#2a3448;
  --text:#fff;--muted:#b0b8cc;--muted2:#606880;
  --cyan:#00e5c3;--cyan3:#00e5c314;
  --amber:#f5a623;--green:#22c55e;--blue:#3b82f6;
  --f:'Inter',sans-serif;
}
html,body{background:var(--bg);color:var(--text);font-family:var(--f);min-height:100vh}
body{
  padding-bottom:5rem;
  background:
    radial-gradient(ellipse 80% 50% at 50% -10%,#0a1628 0%,transparent 60%),
    radial-gradient(ellipse 50% 40% at 100% 0%,#001a14 0%,transparent 50%),
    radial-gradient(ellipse 60% 50% at 0% 100%,#070d1a 0%,transparent 60%),
    #07090f;
  background-attachment:fixed;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes slideIn{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}

/* ── TOPBAR ── */
.topbar{background:rgba(10,13,22,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 2rem;display:flex;align-items:center;position:sticky;top:0;z-index:100;height:56px}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0;cursor:pointer}
.brand:hover .brand-name{color:var(--cyan)}
.brand-icon{width:28px;height:28px;background:var(--cyan);border-radius:5px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:10px;color:#000}
.brand-name{font-size:13px;font-weight:700;letter-spacing:.04em;transition:color .15s}
.brand-sub{font-size:10px;color:var(--muted2);margin-left:6px}
.topbar-nav{display:flex;margin-left:2rem;flex:1}
.tnav{padding:0 16px;font-size:12px;font-weight:600;color:var(--muted2);cursor:pointer;border-bottom:2px solid transparent;height:56px;display:flex;align-items:center;gap:5px;transition:all .15s;letter-spacing:.03em}
.tnav:hover{color:var(--text)}.tnav.active{color:var(--cyan);border-bottom-color:var(--cyan)}
.topbar-right{margin-left:auto;display:flex;gap:8px;align-items:center}

/* ── BTNS ── */
.btn{background:rgba(255,255,255,.04);border:1px solid var(--border2);border-radius:6px;padding:7px 14px;font-family:var(--f);font-size:12px;font-weight:500;color:var(--text);cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .15s;white-space:nowrap}
.btn:hover{border-color:var(--cyan);color:var(--cyan);background:var(--cyan3)}
.btn.cy{border-color:var(--cyan);color:var(--cyan)}.btn.cy:hover{background:var(--cyan);color:#000}
.btn.sm{padding:5px 10px;font-size:11px}.btn.xs{padding:4px 8px;font-size:10px}
.btn.danger{border-color:rgba(0,229,195,.25);color:var(--muted);background:transparent}.btn.danger:hover{background:rgba(0,229,195,.06)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted2)}.btn.ghost:hover{color:var(--text);border-color:var(--border)}
.btn.icon-btn{width:28px;height:28px;padding:0;justify-content:center}
.btn svg{width:13px;height:13px;flex-shrink:0}

/* ── VIEWS ── */
.view{display:none;max-width:1600px;margin:0 auto;padding:1.1rem 1.5rem;animation:fadeUp .2s ease both}
.view.active{display:block}

/* ── HOME ── */
.home-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.75rem;flex-wrap:wrap;gap:12px}
.home-header h2{font-size:20px;font-weight:700;letter-spacing:-.02em}
.home-kpis{display:flex;gap:6px;flex-wrap:wrap}
.hkpi{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:6px;padding:5px 12px;font-size:11px;color:var(--muted)}
.hkpi b{color:var(--cyan);font-weight:700}
.wl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.wl-card{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;transition:border-color .2s,transform .2s,background .2s;animation:fadeUp .25s ease both}
.wl-card:hover{border-color:var(--border2);transform:translateY(-2px);background:rgba(255,255,255,.05)}
.wl-card-top{padding:16px 18px 12px;border-bottom:1px solid var(--border)}
.wl-card-name{font-size:14px;font-weight:700;letter-spacing:-.01em;margin-bottom:4px}
.wl-card-desc{font-size:11px;color:var(--muted2);line-height:1.5}
.wl-card-body{padding:12px 18px;display:flex;align-items:center;gap:12px}
.wl-prog{flex:1}
.wl-prog-bar{height:3px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-bottom:6px}
.wl-prog-fill{height:100%;background:var(--cyan);border-radius:2px;transition:width .6s}
.wl-prog-txt{font-size:10px;color:var(--muted2)}
.wl-prog-txt b{color:var(--muted);font-weight:600}
.wl-badges{display:flex;gap:4px;flex-wrap:wrap}
.wbadge{font-size:9px;font-weight:600;padding:2px 7px;border-radius:3px}
.wbadge.done{background:#22c55e14;color:var(--green);border:1px solid #22c55e22}
.wbadge.pend{background:rgba(255,255,255,.05);color:var(--muted2);border:1px solid var(--border)}
.wbadge.crit{background:rgba(0,229,195,.08);color:var(--muted);border:1px solid rgba(0,229,195,.15)}
.wbadge.alta{background:#f5a62314;color:var(--amber);border:1px solid #f5a62322}
.wl-card-foot{padding:8px 18px;border-top:1px solid var(--border);display:flex;gap:6px;justify-content:flex-end}
.add-wl-card{background:transparent;border:1px dashed var(--border2);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;cursor:pointer;transition:all .2s;gap:8px;min-height:120px}
.add-wl-card:hover{border-color:var(--cyan);background:var(--cyan3)}
.add-wl-card svg,.add-wl-card span{color:var(--muted2);transition:color .2s}
.add-wl-card:hover svg,.add-wl-card:hover span{color:var(--cyan)}
.add-wl-card svg{width:20px;height:20px}
.add-wl-card span{font-size:12px;font-weight:500}
.empty-home{text-align:center;padding:5rem 2rem}
.empty-home .ei{font-size:3rem;margin-bottom:1rem;opacity:.25}
.empty-home p{font-size:14px;margin-bottom:1.5rem;color:var(--muted)}

/* ── DETAIL ── */
.wl-detail-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:1.5rem;gap:12px;flex-wrap:wrap}
.breadcrumb{font-size:11px;color:var(--muted2);margin-bottom:6px;display:flex;align-items:center;gap:5px;cursor:pointer;transition:color .15s}
.breadcrumb:hover{color:var(--cyan)}
.breadcrumb svg{width:11px;height:11px}
.wdh-title{font-size:22px;font-weight:700;letter-spacing:-.02em}
.wdh-desc{font-size:12px;color:var(--muted2);margin-top:4px}
.wdh-right{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start;padding-top:2px}
.wl-tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:1.5rem}
.wltab{padding:10px 18px;font-size:12px;font-weight:600;color:var(--muted2);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;margin-bottom:-1px;letter-spacing:.03em}
.wltab:hover{color:var(--text)}.wltab.active{color:var(--cyan);border-bottom-color:var(--cyan)}

/* ── TASK TABLE ── */
.task-table{width:100%;border-collapse:collapse}
.task-table th{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted2);padding:8px 14px;text-align:left;border-bottom:1px solid var(--border);background:rgba(255,255,255,.02)}
.task-table td{padding:9px 14px;border-bottom:1px solid var(--border);font-size:12px;vertical-align:middle}
.task-table tr:last-child td{border-bottom:none}
.task-table tbody tr:hover td{background:rgba(255,255,255,.025)}
.t-num{color:var(--muted2);font-size:10px;font-weight:500;width:28px}
.t-name{color:var(--text);font-size:13px}
.t-name.done{color:var(--muted2);text-decoration:line-through;text-decoration-color:var(--border2)}

/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:600;white-space:nowrap}
.b-critica{background:rgba(0,229,195,.08);color:var(--muted);border:1px solid rgba(0,229,195,.2)}
.b-alta{background:#f5a62314;color:var(--amber);border:1px solid #f5a62328}
.b-media{background:#3b82f614;color:var(--blue);border:1px solid #3b82f628}
.b-baixa{background:rgba(255,255,255,.05);color:var(--muted2);border:1px solid var(--border)}
.b-done{background:#22c55e14;color:var(--green);border:1px solid #22c55e28;cursor:pointer;transition:background .12s}
.b-done:hover{background:#22c55e22}
.b-prog{background:#3b82f614;color:#60a5fa;border:1px solid #3b82f628;cursor:pointer;transition:background .12s}
.b-prog:hover{background:#3b82f622}
.b-pend{background:rgba(255,255,255,.05);color:var(--muted2);border:1px solid var(--border);cursor:pointer;transition:background .12s}
.b-pend:hover{background:rgba(255,255,255,.09)}
.b-person{background:var(--cyan3);color:var(--cyan);border:1px solid #00e5c322}
.b-client{background:rgba(255,255,255,.05);color:var(--muted);border:1px solid var(--border)}

/* ── ADD / EDIT FORM ── */
.add-row td{padding:10px 14px;background:rgba(255,255,255,.02)}
.add-form{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
input.inp,select.inp,textarea.inp{background:rgba(255,255,255,.05);border:1px solid var(--border2);border-radius:6px;padding:7px 10px;font-family:var(--f);font-size:12px;color:var(--text);outline:none;transition:border-color .15s,background .15s}
input.inp:focus,select.inp:focus,textarea.inp:focus{border-color:var(--cyan);background:rgba(0,229,195,.04)}
select.inp option{background:#0d1017}
.inp.grow{flex:1;min-width:160px}
.inp.w100{width:100px}.inp.w110{width:110px}.inp.w120{width:120px}
.empty-row td{text-align:center;padding:24px;color:var(--muted2);font-size:11px}

/* ── CLIENTS SETTINGS ── */
.clients-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-bottom:1rem}
.client-chip{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:12px;font-weight:500}
.client-chip-name{flex:1;color:var(--text)}
.client-chip-actions{display:flex;gap:4px}

/* ── REPORT ── */
.rpt-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:580px){.rpt-kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:8px;padding:1rem 1.25rem;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--cyan);opacity:.25}
.kpi.acc::before{opacity:1}
.kpi-lbl{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}
.kpi-val{font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1;color:var(--cyan)}
.kpi.g .kpi-val{color:var(--green)}.kpi.a .kpi-val{color:var(--amber)}.kpi.r .kpi-val{color:var(--muted)}
.kpi-sub{font-size:11px;color:var(--muted);margin-top:.35rem}
.pw{height:3px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-top:.5rem}
.pf{height:100%;border-radius:2px;transition:width 1s}
.sec{margin-bottom:2.5rem}
.slbl{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:1rem;display:flex;align-items:center;gap:8px}
.slbl::after{content:'';flex:1;height:1px;background:var(--border)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:620px){.two-col{grid-template-columns:1fr}}
.hm-wrap{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:8px;padding:1.25rem}
.hm-title{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:.875rem}
.hm-row{display:grid;grid-template-columns:110px 1fr;gap:4px;align-items:center;margin-bottom:4px}
.hm-lbl{font-size:11px;font-weight:500;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:6px}
.hm-cell{height:30px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;cursor:default;position:relative;transition:filter .15s}
.hm-cell:hover{filter:brightness(1.25)}
.hm-cell:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#0d1017;border:1px solid var(--border2);padding:5px 10px;border-radius:6px;font-size:11px;font-weight:400;white-space:nowrap;color:var(--text);pointer-events:none;z-index:20;box-shadow:0 4px 16px #00000060}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:.75rem}
.legend-item{display:flex;align-items:center;gap:4px;font-size:10px;font-weight:500;color:var(--muted)}
.lsw{width:11px;height:11px;border-radius:2px}
.person-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.pc{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:8px;padding:.875rem 1rem}
.pc-name{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--cyan);margin-bottom:.4rem}
.pc-val{font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1.2}
.pc-sub{font-size:11px;color:var(--muted);margin-top:2px}
.pc-bar{height:3px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-top:8px}
.pc-fill{height:100%;background:var(--cyan);border-radius:2px;transition:width 1s .1s}
.cli-table{width:100%;border-collapse:collapse}
.cli-table th{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:9px 14px;text-align:left;border-bottom:1px solid var(--border)}
.cli-table td{padding:10px 14px;border-bottom:1px solid var(--border);font-size:12px;vertical-align:middle}
.cli-table tr:last-child td{border-bottom:none}
.cli-table tr:hover td{background:rgba(255,255,255,.025)}
.pill{display:inline-flex;align-items:center;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:600}
.pill.d{background:#22c55e14;color:var(--green);border:1px solid #22c55e22}
.pill.p{background:#f5a62314;color:var(--amber);border:1px solid #f5a62322}
.pill.c{background:rgba(0,229,195,.08);color:var(--muted);border:1px solid rgba(0,229,195,.15)}
.pill.h{background:#f5a62314;color:var(--amber);border:1px solid #f5a62322}
.mbar{display:flex;align-items:center;gap:6px}
.mb-bg{flex:1;height:3px;background:var(--bg3);border-radius:2px;overflow:hidden;min-width:40px}
.mb-fill{height:100%;background:var(--green);border-radius:2px}
.mpct{font-size:11px;font-weight:500;color:var(--muted);min-width:32px;text-align:right}
.cli-sec{margin-bottom:1.5rem}
.cli-head{display:flex;align-items:center;gap:8px;margin-bottom:.75rem;flex-wrap:wrap}
.cli-head h3{font-size:14px;font-weight:700;letter-spacing:-.01em}
.ccount{font-size:10px;font-weight:500;color:var(--muted);padding:2px 8px;border:1px solid var(--border);border-radius:4px}
.rt{display:grid;grid-template-columns:22px 1fr auto auto;gap:8px;align-items:center;padding:8px 12px;border-radius:6px;border:1px solid transparent;margin-bottom:3px;transition:background .12s,border-color .12s}
.rt:hover{background:rgba(255,255,255,.03);border-color:var(--border)}
.rt-n{font-size:10px;font-weight:500;color:var(--muted2)}
.rt-name{font-size:13px;color:var(--text)}.rt-name.done{color:var(--muted2);text-decoration:line-through;text-decoration-color:var(--border2)}
.tag{font-size:10px;font-weight:600;padding:2px 7px;border-radius:3px}
.tp{background:var(--cyan3);color:var(--cyan);border:1px solid #00e5c322}
.td{color:var(--green)}.tc{color:var(--muted2)}.th{color:var(--amber)}.tm{color:var(--blue)}.tn{color:var(--muted2)}

/* ── FILTER BAR ── */
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;padding:10px 14px;background:rgba(255,255,255,.025);border:1px solid var(--border);border-radius:8px}
.filter-bar label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted2);white-space:nowrap}
.filter-bar select.inp{padding:5px 8px;font-size:11px;height:30px}
.filter-bar .inp.w130{width:130px}
.filter-active{border-color:var(--cyan) !important;background:var(--cyan3) !important}
.filter-count{font-size:11px;color:var(--muted2);margin-left:auto}
.filter-count b{color:var(--cyan);font-weight:600}

/* ── DRAWER (modal lateral direito) ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:flex;align-items:stretch;justify-content:flex-end;backdrop-filter:blur(3px)}
.overlay.hidden{display:none;pointer-events:none}
.modal{
  background:#0b0e18;
  border-left:1px solid var(--border2);
  width:420px;max-width:100vw;
  height:100vh;overflow-y:auto;
  padding:0;
  display:flex;flex-direction:column;
  animation:drawerIn .22s cubic-bezier(.16,1,.3,1) both;
  box-shadow:-20px 0 60px rgba(0,0,0,.5);
}
@keyframes drawerIn{from{transform:translateX(100%);opacity:.5}to{transform:translateX(0);opacity:1}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes dotPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
.drawer-head{padding:20px 24px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#0b0e18;z-index:2}
.drawer-head h3{font-size:15px;font-weight:700}
.drawer-body{padding:20px 24px;flex:1}
.drawer-foot{padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:center;position:sticky;bottom:0;background:#0b0e18}
.drawer-foot .spacer{flex:1}
.drawer-section{margin-bottom:20px}
.drawer-section-title{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--muted2);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.drawer-section-title::after{content:'';flex:1;height:1px;background:var(--border)}
.frow{margin-bottom:12px}
.frow label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);display:block;margin-bottom:5px}
.frow .inp{width:100%}
.frow-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.frow-2 label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);display:block;margin-bottom:5px}
.frow-2 .inp{width:100%}
/* date input fix */
input[type="date"].inp::-webkit-calendar-picker-indicator{filter:invert(.5);cursor:pointer}
input[list].inp::-webkit-list-button{opacity:.5}
.task-meta-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.sdot{width:7px;height:7px;border-radius:50%;background:var(--cyan);display:inline-block;margin-right:6px;animation:pulse 2s infinite}

/* ── VIEW TOGGLE ── */
.view-toggle{display:flex;gap:0;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:6px;overflow:hidden;flex-shrink:0}
.vt-btn{padding:5px 11px;font-size:11px;font-weight:500;color:var(--muted2);cursor:pointer;border:none;background:transparent;font-family:var(--f);transition:all .15s;display:flex;align-items:center;gap:5px;white-space:nowrap}
.vt-btn:hover{color:var(--text)}
.vt-btn.active{background:rgba(0,229,195,.12);color:var(--cyan)}
.vt-btn svg{width:13px;height:13px}
/* ── GROUP BLOCK ── */
.group-block{margin-bottom:16px}
.group-header{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:8px 8px 0 0;border-bottom:none;cursor:pointer;user-select:none}
.group-header:hover{background:rgba(255,255,255,.05)}

<script>
// ═══════════════════════════════════════════════════════════════
// Capture original HTML source BEFORE any DOM mutations
// ═══════════════════════════════════════════════════════════════
const SOURCE_HTML = document.documentElement.outerHTML;

// ═══════════════════════════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════════════════════════
const PEOPLE   = ['GIOVANNY','RUBENS','IAN','CAIO','OUTRO'];
const DEF_CLIENTS = ['TECHSYS','CLINEX','PROMED','ANSER','ETHOS','BIRA','LIFE CENTER','P.E','OUTROS'];
const PRIORITIES = [
  {v:'critica',  lbl:'🔥 Crítica',  cls:'b-critica'},
  {v:'alta',     lbl:'🔺 Alta',     cls:'b-alta'},
  {v:'media',    lbl:'🔵 Média',    cls:'b-media'},
  {v:'baixa',    lbl:'· Baixa',     cls:'b-baixa'},
];
const KEY = 'sete_wl_v2';

// ═══════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════
let S = {lists:[], clients:[...DEF_CLIENTS], reports:[], matrix:{}};
let currentListId = null;
let editingListId  = null;
let editingTaskId  = null;  // for task edit modal
let filterClient   = '';
let filterPerson   = '';
let filterStatus   = '';
let filterPriority = '';
let detailTab = 'gestao';
let currentScreen = 'home';
let currentRoadmapClient = '';
let gestaoView = 'cliente'; // 'lista' | 'cliente' | 'projeto'
let tlFilterClient = '', tlFilterStatus = '', tlFilterPriority = '';
let matrixFilterClient = '';

// ═══════════════════════════════════════════════════════════════
// ── JSONBIN CONFIG — cole suas credenciais aqui ────────────────
// ═══════════════════════════════════════════════════════════════
const JSONBIN_BIN_ID  = '6a0fb11a6610dd3ae8857aca';
const JSONBIN_API_KEY = '$2a$10$XScwUIHdYeTmNf8IoQ6xUOhvKeiv2KW8Dy4Pr/kXiCkuRxqO6QLme';
// ═══════════════════════════════════════════════════════════════

let _syncTimer = null;
let _syncing   = false;
let _dirty     = false;

// ── detect if running locally (file://) ───────────────────────
const IS_LOCAL = location.protocol === 'file:';

// ── sync status indicator ──────────────────────────────────────
function setSyncStatus(state, msg){
  const dot   = document.getElementById('sync-dot');
  const label = document.getElementById('sync-label');
  if(!dot||!label) return;
  const cfg = {
    idle:    {dot:'var(--muted2)',  text:'',             lbl:'',               pulse:false},
    saving:  {dot:'var(--amber)',   text:'var(--amber)',  lbl:'Salvando...',    pulse:true},
    saved:   {dot:'var(--cyan)',    text:'var(--cyan)',   lbl:'Salvo',          pulse:false},
    error:   {dot:'var(--muted)',   text:'var(--muted)',    lbl:'Erro ao salvar', pulse:false},
    offline: {dot:'var(--muted2)', text:'var(--muted2)', lbl:'Local',          pulse:false},
    local:   {dot:'var(--amber)',  text:'var(--amber)',  lbl:'Arquivo local',  pulse:false},
  };
  const c = cfg[state]||cfg.idle;
  dot.style.background = c.dot;
  label.style.color    = c.text;
  label.textContent    = msg||c.lbl;
  dot.style.animation  = c.pulse ? 'dotPulse .9s ease-in-out infinite' : '';
}

function showLocalBanner(){
  if(!document.getElementById('local-banner')){
    const b = document.createElement('div');
    b.id = 'local-banner';
    b.innerHTML = `<span>⚠ Você está abrindo o arquivo localmente (<code>file://</code>) — o JSONBin não funciona assim. <b>Publique no Netlify</b> para sincronizar na nuvem. Os dados continuam salvos no localStorage deste navegador.</span>
      <button onclick="this.parentElement.remove()" style="background:transparent;border:none;color:var(--amber);cursor:pointer;font-size:16px;line-height:1;padding:0 4px">✕</button>`;
    Object.assign(b.style,{
      position:'fixed', top:'56px', left:'0', right:'0', zIndex:'99',
      background:'rgba(245,166,35,.12)', borderBottom:'1px solid rgba(245,166,35,.3)',
      padding:'9px 2rem', display:'flex', alignItems:'center', justifyContent:'space-between',
      gap:'12px', fontSize:'12px', color:'var(--amber)', fontFamily:'var(--f)'
    });
    document.body.appendChild(b);
  }
}

// ── local persist (always, as fallback) ───────────────────────
function persistLocal(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
}

// ── debounced remote save ──────────────────────────────────────
function persist(){
  persistLocal();
  if(IS_LOCAL){ setSyncStatus('local','Arquivo local'); return; }
  _dirty = true;
  if(_syncTimer) clearTimeout(_syncTimer);
  _syncTimer = setTimeout(()=>syncRemote(), 1200);
}

async function syncRemote(){
  if(IS_LOCAL) return;
  if(!JSONBIN_BIN_ID || !JSONBIN_API_KEY){ setSyncStatus('offline','Sem credenciais'); return; }
  if(_syncing){ _dirty=true; return; }
  _syncing = true;
  setSyncStatus('saving');
  try{
    const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
      method:'PUT',
      headers:{
        'Content-Type':'application/json',
        'X-Master-Key': JSONBIN_API_KEY,
        'X-Bin-Versioning':'false'
      },
      body: JSON.stringify(S)
    });
    if(!res.ok) throw new Error('HTTP '+res.status);
    _dirty = false;
    setSyncStatus('saved','Salvo');
    setTimeout(()=>setSyncStatus('idle'), 2500);
  }catch(err){
    setSyncStatus('error','Erro ao salvar');
    // only log once, not every retry
    if(!window._syncErrLogged){ console.warn('[JSONBin] Save failed:', err.message); window._syncErrLogged=true; }
  }finally{
    _syncing = false;
    if(_dirty) syncRemote();
  }
}

// ── load from remote, fallback to local ───────────────────────
async function hydrate(){
  setSyncStatus('saving','Carregando...');

  // Skip remote entirely if file://
  if(IS_LOCAL){
    showLocalBanner();
    // Try localStorage
    try{
      const r = localStorage.getItem(KEY);
      if(r){ const d=JSON.parse(r); if(d&&d.lists){ S=d; if(!S.clients)S.clients=[...DEF_CLIENTS]; if(!S.reports)S.reports=[]; if(!S.matrix)S.matrix={}; setSyncStatus('local','Arquivo local'); return; } }
    }catch(e){}
    // Try embedded JSON tag
    try{
      const el = document.getElementById('__data_backup__');
      if(el && el.textContent.trim()){
        const d=JSON.parse(el.textContent);
        if(d&&d.lists){ S=d; if(!S.clients)S.clients=[...DEF_CLIENTS]; if(!S.reports)S.reports=[]; if(!S.matrix)S.matrix={}; persistLocal(); setSyncStatus('local','Arquivo local'); return; }
      }
    }catch(e){}
    setSyncStatus('local','Arquivo local');
    return;
  }

  // Try remote
  if(JSONBIN_BIN_ID && JSONBIN_API_KEY){
    try{
      const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
        headers:{'X-Master-Key': JSONBIN_API_KEY}
      });
      if(res.ok){
        const json = await res.json();
        const d = json.record;
        if(d && d.lists){
          S = d;
          if(!S.clients) S.clients=[...DEF_CLIENTS];
          if(!S.reports) S.reports=[];
          if(!S.matrix) S.matrix={};
          persistLocal();
          setSyncStatus('saved','Nuvem');
          setTimeout(()=>setSyncStatus('idle'), 2500);
          return;
        }
      }
    }catch(err){
      console.warn('[JSONBin] Load failed:', err.message);
    }
  }

  // Fallback: localStorage
  try{
    const r = localStorage.getItem(KEY);
    if(r){ const d=JSON.parse(r); if(d&&d.lists){ S=d; if(!S.clients)S.clients=[...DEF_CLIENTS]; if(!S.reports)S.reports=[]; if(!S.matrix)S.matrix={}; setSyncStatus('offline','Cache local'); return; } }
  }catch(e){}

  // Fallback: embedded tag
  try{
    const el = document.getElementById('__data_backup__');
    if(el && el.textContent.trim()){
      const d=JSON.parse(el.textContent);
      if(d&&d.lists){ S=d; if(!S.clients)S.clients=[...DEF_CLIENTS]; if(!S.reports)S.reports=[]; if(!S.matrix)S.matrix={}; persistLocal(); setSyncStatus('offline','Dados do arquivo'); return; }
    }
  }catch(e){}

  setSyncStatus('offline','Sem dados');
}

// ── Import JSON backup ─────────────────────────────────────────
function importBackup(){
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='.json,.html';
  inp.onchange = e => {
    const f = e.target.files[0]; if(!f) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const raw = ev.target.result;
      let data = null;
      try{ data = JSON.parse(raw); }catch(_){}
      if(!data){
        try{
          const m = raw.match(/<script[^>]+id="__data_backup__"[^>]*>([\s\S]*?)<\/script>/);
          if(m) data = JSON.parse(m[1]);
        }catch(_){}
      }
      if(!data || !data.lists){ alert('Arquivo inválido.'); return; }
      S = data;
      if(!S.clients) S.clients = [...DEF_CLIENTS];
      persist();
      goHome();
      setTimeout(()=>toast('✅ Backup importado e sincronizado!'), 100);
    };
    reader.readAsText(f);
  };
  inp.click();
}

// ── Export JSON backup ─────────────────────────────────────────
function downloadBackup(){
  triggerDownload(JSON.stringify(S,null,2), 'application/json', 'sete-backup-'+isoDate()+'.json');
}

// ── Export self-contained HTML ─────────────────────────────────
function exportHTML(){
  const json = JSON.stringify(S, null, 2);
  const dataTag = `<script id="__data_backup__" type="application/json">\n${json}\n<\/script>`;
  let html = SOURCE_HTML
    .replace(/<script[^>]+id="__data_backup__"[^>]*>[\s\S]*?<\/script>\s*/g, '')
    .replace(/<\/body>/, dataTag + '\n</body>');
  triggerDownload(html, 'text/html', 'sete-company-'+isoDate()+'.html');
  setTimeout(()=>toast('✅ HTML exportado!'), 100);
}

// ── Misc helpers ───────────────────────────────────────────────
function triggerDownload(content, mime, filename){
  const blob = new Blob([content],{type:mime});
  const url  = URL.createObjectURL(blob);
  const a    = Object.assign(document.createElement('a'),{href:url,download:filename});
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },1000);
}
function isoDate(){ return new Date().toISOString().slice(0,10); }
function toast(msg){
  const el=document.createElement('div');
  el.textContent=msg;
  Object.assign(el.style,{
    position:'fixed',bottom:'24px',left:'50%',transform:'translateX(-50%)',
    background:'#0d1017',border:'1px solid var(--border2)',borderLeft:'3px solid var(--cyan)',
    color:'var(--text)',padding:'10px 20px',borderRadius:'8px',
    fontSize:'13px',fontWeight:'500',zIndex:'9999',
    boxShadow:'0 8px 24px rgba(0,0,0,.5)',
    transition:'opacity .3s',opacity:'1',fontFamily:'Inter,sans-serif'
  });
  document.body.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; setTimeout(()=>el.remove(),300); },2500);
}

function saveConfig(){
  const bin = document.getElementById('cfg-bin').value.trim();
  const key = document.getElementById('cfg-key').value.trim();
  if(!bin||!key){ toast('⚠ Preencha os dois campos'); return; }
  localStorage.setItem('sc_bin_id', bin);
  localStorage.setItem('sc_api_key', key);
  // Patch runtime constants
  window._cfgBin = bin; window._cfgKey = key;
  closeModal();
  toast('🔄 Reconectando ao JSONBin...');
  setTimeout(()=>location.reload(), 800);
}

function clearConfig(){
  if(!confirm('Remover credenciais JSONBin? Os dados locais são mantidos.')) return;
  localStorage.removeItem('sc_bin_id');
  localStorage.removeItem('sc_api_key');
  closeModal();
  toast('Credenciais removidas');
  setTimeout(()=>location.reload(), 800);
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function allTasks(){return S.lists.flatMap(l=>l.tasks||[])}
function prioCls(v){return (PRIORITIES.find(p=>p.v===v)||PRIORITIES[1]).cls}
function prioLbl(v){return (PRIORITIES.find(p=>p.v===v)||PRIORITIES[1]).lbl}
function todayISO(){return new Date().toISOString().slice(0,10)}
function fmtDate(iso){
  if(!iso)return'';
  const [y,m,d]=iso.split('-');
  return `${d}/${m}/${y}`;
}

function commit(){
  persist();

  else if(currentScreen==='detail'){
    patchDetailHeader();
    if(detailTab==='gestao')patchGestao();
    else patchReport();

  else if(currentScreen==='roadmap')renderRoadmap();
  else if(currentScreen==='timeline')renderTimeline();
  else if(currentScreen==='matrix')renderMatrix();
  renderTopbar();
}

function showModal(html){
  const box=document.getElementById('modal-box');
  box.className='modal';
  box.innerHTML=html;
  document.getElementById('modal').classList.remove('hidden');
  setTimeout(()=>{const f=box.querySelector('input:not([type=date]),select');if(f)f.focus();},80);
}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
document.getElementById('modal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

function openListModal(id){
  editingListId=id||null;
  const l=id?S.lists.find(x=>x.id===id):null;
  showModal(`
    <div class="drawer-head">
      <h3>${id?'Editar worklist':'Nova worklist'}</h3>

      </div>
      <div class="frow"><label>Descrição (opcional)</label>

function saveList(){
  const name=document.getElementById('m-lname').value.trim();
  if(!name){document.getElementById('m-lname').focus();return;}
  const desc=document.getElementById('m-ldesc').value.trim();
  if(editingListId){
    const l=S.lists.find(x=>x.id===editingListId);
    if(l){l.name=name;l.desc=desc;}
    closeModal();commit();
  } else {
    const id=uid();
    S.lists.push({id,name,desc,tasks:[],createdAt:Date.now()});
    closeModal();persist();renderTopbar();
    openDetail(id);
  }
}

function openAddTask(){
  editingTaskId=null;
  showModal(taskDrawerHTML(false, null));
}

function openEditTask(lid, tid){
  editingTaskId=tid;
  const l=S.lists.find(x=>x.id===lid);if(!l)return;
  const t=l.tasks.find(x=>x.id===tid);if(!t)return;
  showModal(taskDrawerHTML(true, t));
}

function saveTask(){
  const name=document.getElementById('mt-name').value.trim();
  if(!name){document.getElementById('mt-name').focus();return;}
  const l=S.lists.find(x=>x.id===currentListId);if(!l)return;
  const fields={
    name,
    project  : document.getElementById('mt-proj').value.trim(),
    priority : document.getElementById('mt-prio').value,
    status   : document.getElementById('mt-status').value,
    person   : document.getElementById('mt-resp').value,
    client   : document.getElementById('mt-cli').value,
    dueDate  : document.getElementById('mt-due').value,
    notes    : document.getElementById('mt-notes').value.trim(),
  };
  if(editingTaskId){
    const t=l.tasks.find(x=>x.id===editingTaskId);
    if(t) Object.assign(t, fields);
  } else {
    l.tasks=l.tasks||[];
    l.tasks.push({id:uid(), ...fields, createdAt:Date.now()});
  }
  closeModal();commit();
}

function deleteTaskById(lid,tid){
  const l=S.lists.find(x=>x.id===lid);if(!l)return;
  l.tasks=l.tasks.filter(x=>x.id!==tid);
  closeModal();commit();
}

function cycleStatus(lid,tid){
  const l=S.lists.find(x=>x.id===lid);if(!l)return;
  const t=l.tasks.find(x=>x.id===tid);if(!t)return;
  const c=['pendente','em andamento','concluido'];
  t.status=c[(c.indexOf(t.status)+1)%3];
  commit();
}

function saveClient(oldName){
  const name=document.getElementById('mc-name').value.trim().toUpperCase();
  if(!name)return;
  if(oldName){
    const i=S.clients.indexOf(oldName);
    if(i>-1){S.clients[i]=name;}
    // Update tasks referencing old name
    S.lists.forEach(l=>(l.tasks||[]).forEach(t=>{if(t.client===oldName)t.client=name;}));
  } else {
    if(!S.clients.includes(name))S.clients.push(name);
  }
  closeModal();commit();
}
function deleteClient(name){
  if(!confirm(`Remover "${name}"? As tarefas que usam esse cliente não serão alteradas.`))return;
  S.clients=S.clients.filter(x=>x!==name);
  closeModal();commit();
}

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:13px;height:13px"><path d="M12 5v14M5 12h14"/></svg>
        Criar primeira worklist
      </button>
    </div>`;return;
  }
  let cards=S.lists.map((l,i)=>{
    const ts=l.tasks||[];
    const dn=ts.filter(t=>t.status==='concluido').length;
    const pd=ts.filter(t=>t.status!=='concluido').length;
    const cr=ts.filter(t=>t.status!=='concluido'&&t.priority==='critica').length;
    const al=ts.filter(t=>t.status!=='concluido'&&t.priority==='alta').length;
    const pct=ts.length?Math.round(dn/ts.length*100):0;
    const badges=[
      dn>0?`<span class="wbadge done">✅ ${dn}</span>`:'',
      pd>0?`<span class="wbadge pend">⏳ ${pd}</span>`:'',
      al>0?`<span class="wbadge alta">🔺 ${al}</span>`:'',
      cr>0?`<span class="wbadge crit">🔥 ${cr}</span>`:''
    ].filter(Boolean).join('');
    return `<div class="wl-card" style="animation-delay:${i*.05}s" onclick="openDetail('${l.id}')">
      <div class="wl-card-top">
        <div class="wl-card-name">${l.name}</div>
        ${l.desc?`<div class="wl-card-desc">${l.desc}</div>`:''}
      </div>
      <div class="wl-card-body">
        <div class="wl-prog">
          <div class="wl-prog-bar"><div class="wl-prog-fill" style="width:${pct}%"></div></div>
          <div class="wl-prog-txt"><b>${dn}</b> de ${ts.length} · <b>${pct}%</b></div>
        </div>
        <div class="wl-badges">${badges||'<span class="wbadge pend">Sem demandas</span>'}</div>
      </div>
      <div class="wl-card-foot" onclick="event.stopPropagation()">
        <button class="btn xs" onclick="openListModal('${l.id}')">Editar</button>
        <button class="btn xs danger" onclick="deleteList('${l.id}')">Excluir</button>
      </div>
    </div>`;
  }).join('');
  cards+=`<div class="add-wl-card" onclick="openListModal()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 5v14M5 12h14"/></svg>
    <span>Nova worklist</span>
  </div>`;
  el.innerHTML=`
    <div class="home-header">
      <h2>Worklists</h2>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <div class="home-kpis">
          <span class="hkpi"><b>${S.lists.length}</b> lista${S.lists.length!==1?'s':''}</span>
          <span class="hkpi">Total <b>${all.length}</b></span>
          <span class="hkpi">✅ <b>${done}</b></span>
          <span class="hkpi">Perf <b>${perf}%</b></span>
        </div>
        <button class="btn cy sm" onclick="openListModal()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
          Nova lista
        </button>
      </div>
    </div>
    <div class="wl-grid">${cards}</div>`;
}

function statusBadge(t){
  const lid=currentListId,tid=t.id;
  if(t.status==='concluido') return`<span class="badge b-done" onclick="cycleStatus('${lid}','${tid}')" title="Clique para mudar">✅ Concluído</span>`;
  if(t.status==='em andamento') return`<span class="badge b-prog" onclick="cycleStatus('${lid}','${tid}')" title="Clique para mudar">⏳ Andamento</span>`;
  return`<span class="badge b-pend" onclick="cycleStatus('${lid}','${tid}')" title="Clique para mudar">· Pendente</span>`;
}

function setFilter(key, val){
  if(key==='client')        filterClient=val;
  else if(key==='person')   filterPerson=val;
  else if(key==='status')   filterStatus=val;
  else if(key==='priority') filterPriority=val;
  patchGestao();
}
function clearFilters(){filterClient='';filterPerson='';filterStatus='';filterPriority='';patchGestao();}
function setGestaoView(v){gestaoView=v;patchGestao();}
function toggleGroup(id){
  const el=document.getElementById('grp-'+id);
  const ch=document.getElementById('chv-'+id);
  if(!el)return;
  const hidden=el.style.display==='none';
  el.style.display=hidden?'':'none';
  if(ch)ch.classList.toggle('collapsed',!hidden);
}

function taskRow(t, l, i){
  const overdue = t.dueDate && t.status!=='concluido' && t.dueDate < todayISO();
  const dueTxt  = t.dueDate
    ? `<span style="font-size:11px;${overdue?'color:var(--muted);font-weight:600':'color:var(--muted2)'}">${overdue?'⚠ ':''}${fmtDate(t.dueDate)}</span>`
    : `<span style="color:var(--muted2);font-size:11px">—</span>`;
  return `<tr>
    <td class="t-num">${i+1}</td>
    <td><span class="t-name${t.status==='concluido'?' done':''}">${t.name}</span></td>
    <td><span class="badge ${prioCls(t.priority)}">${prioLbl(t.priority)}</span></td>
    <td>${statusBadge(t)}</td>
    <td>${t.person?`<span class="badge b-person">${t.person}</span>`:'<span style="color:var(--muted2);font-size:11px">—</span>'}</td>
    <td>${t.client?`<span class="badge b-client">${t.client}</span>`:'<span style="color:var(--muted2);font-size:11px">—</span>'}</td>
    <td>${dueTxt}</td>
    <td style="text-align:right">
      <button class="btn icon-btn" onclick="openEditTask('${l.id}','${t.id}')" title="Editar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      </button>
    </td>
  </tr>`;
}

function tableWrap(rows, grouped=false){
  const radius = grouped ? '0 0 8px 8px' : '10px';
  return `<div style="background:rgba(255,255,255,.025);border:1px solid var(--border);border-radius:${radius};overflow:hidden">
    <table class="task-table">
      <thead><tr>
        <th>#</th><th>Demanda</th><th>Prioridade</th><th>Status</th>
        <th>Responsável</th><th>Cliente</th><th>Prazo</th><th></th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

function groupBlock(key, tasks, l, label){
  const gid = key.replace(/[^a-z0-9]/gi,'_');
  const done = tasks.filter(t=>t.status==='concluido').length;
  const pct  = tasks.length ? Math.round(done/tasks.length*100) : 0;
  const rows = tasks.map((t,i)=>taskRow(t,l,i+1)).join('');
  const emptyRow = `<tr class="empty-row"><td colspan="8">Sem demandas neste grupo.</td></tr>`;
  return `<div class="group-block">
    <div class="group-header" onclick="toggleGroup('${gid}')">
      <div class="group-title">
        <svg id="chv-${gid}" class="group-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:13px;height:13px"><path d="M6 9l6 6 6-6"/></svg>
        ${label}
        <span style="font-size:10px;font-weight:400;color:var(--muted2)">${tasks.length} tarefa${tasks.length!==1?'s':''}</span>
      </div>
      <div class="group-meta">
        <div style="width:60px;height:3px;background:var(--bg3);border-radius:2px;overflow:hidden">
          <div style="width:${pct}%;height:100%;background:${pct===100?'var(--green)':'var(--cyan)'};border-radius:2px"></div>
        </div>
        <span class="group-pct">${pct}%</span>
        <span style="font-size:11px;color:var(--green)">${done} ✅</span>
      </div>
    </div>
    <div id="grp-${gid}" class="group-table">
      <table class="task-table">
        <thead><tr>
          <th>#</th><th>Demanda</th><th>Prioridade</th><th>Status</th>
          <th>Responsável</th><th>Cliente</th><th>Prazo</th><th></th>
        </tr></thead>
        <tbody>${rows||emptyRow}</tbody>
      </table>
    </div>
  </div>`;
}

function patchGestao(){
  const l=S.lists.find(x=>x.id===currentListId);if(!l)return;
  const allTs=l.tasks||[];
  const body=document.getElementById('detail-body');if(!body)return;

  const usedClients=[...new Set(allTs.map(t=>t.client).filter(Boolean))].sort();
  const usedPersons=[...new Set(allTs.map(t=>t.person).filter(Boolean))].sort();

  const ts=allTs.filter(t=>{
    if(filterClient   && t.client!==filterClient)     return false;
    if(filterPerson   && t.person!==filterPerson)     return false;
    if(filterStatus   && t.status!==filterStatus)     return false;
    if(filterPriority && t.priority!==filterPriority) return false;
    return true;
  });

  const hasFilter=filterClient||filterPerson||filterStatus||filterPriority;
  const clientOpts=`<option value="">Todos os clientes</option>`+usedClients.map(c=>`<option value="${c}"${filterClient===c?' selected':''}>${c}</option>`).join('');
  const personOpts=`<option value="">Todos os responsáveis</option>`+usedPersons.map(p=>`<option value="${p}"${filterPerson===p?' selected':''}>${p}</option>`).join('');
  const statusOpts=`<option value="">Todos os status</option>
    <option value="pendente"${filterStatus==='pendente'?' selected':''}>· Pendente</option>
    <option value="em andamento"${filterStatus==='em andamento'?' selected':''}>⏳ Em andamento</option>
    <option value="concluido"${filterStatus==='concluido'?' selected':''}>✅ Concluído</option>`;
  const prioOpts=`<option value="">Todas as prioridades</option>`+PRIORITIES.map(p=>`<option value="${p.v}"${filterPriority===p.v?' selected':''}>${p.lbl}</option>`).join('');

  // ── Build content by view mode ────────────────────────────────
  let content = '';

  if(gestaoView === 'lista'){
    // Flat list
    const rows = ts.length===0
      ? `<tr class="empty-row"><td colspan="8">${hasFilter?'Nenhuma demanda com esses filtros.':'Nenhuma demanda ainda.'}</td></tr>`
      : ts.map((t,i)=>taskRow(t,l,i+1)).join('');
    content = tableWrap(rows);

  } else if(gestaoView === 'cliente'){
    // Group by client
    if(ts.length===0){
      content=`<div class="empty-row" style="text-align:center;padding:24px;color:var(--muted2);font-size:11px">${hasFilter?'Nenhuma demanda com esses filtros.':'Nenhuma demanda ainda.'}</div>`;
    } else {
      const byClient={};
      ts.forEach(t=>{
        const k=t.client||'Sem cliente';
        (byClient[k]=byClient[k]||[]).push(t);
      });
      const sorted=Object.keys(byClient).sort();
      content=sorted.map(cli=>groupBlock(cli, byClient[cli], l, `<span class="badge b-client" style="font-size:11px">${cli}</span>`)).join('');
    }

  } else {
    // Group by project
    if(ts.length===0){
      content=`<div class="empty-row" style="text-align:center;padding:24px;color:var(--muted2);font-size:11px">${hasFilter?'Nenhuma demanda com esses filtros.':'Nenhuma demanda ainda.'}</div>`;
    } else {
      const byProj={};
      ts.forEach(t=>{
        const k=t.project||'Sem projeto';
        (byProj[k]=byProj[k]||[]).push(t);
      });
      const sorted=Object.keys(byProj).sort();
      content=sorted.map(proj=>groupBlock(proj, byProj[proj], l,
        `<span style="font-size:12px;font-weight:600;color:var(--cyan)">${proj}</span>`
      )).join('');
    }
  }

  const SVG_LIST=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>`;
  const SVG_CLI=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>`;
  const SVG_PROJ=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>`;

  body.innerHTML=`
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;flex-wrap:wrap">
      <div class="filter-bar" style="flex:1">
        <label>Filtrar</label>
        <select class="inp w130 ${filterClient?'filter-active':''}"   onchange="setFilter('client',this.value)">${clientOpts}</select>
        <select class="inp w130 ${filterPerson?'filter-active':''}"   onchange="setFilter('person',this.value)">${personOpts}</select>
        <select class="inp w120 ${filterPriority?'filter-active':''}" onchange="setFilter('priority',this.value)">${prioOpts}</select>
        <select class="inp w120 ${filterStatus?'filter-active':''}"   onchange="setFilter('status',this.value)">${statusOpts}</select>
        ${hasFilter?`<button class="btn xs danger" onclick="clearFilters()">✕ Limpar</button>`:''}
        <span class="filter-count"><b>${ts.length}</b> de ${allTs.length} demanda${allTs.length!==1?'s':''}</span>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <div class="view-toggle">
          <button class="vt-btn${gestaoView==='lista'?' active':''}" onclick="setGestaoView('lista')" title="Lista plana">${SVG_LIST} Lista</button>
          <button class="vt-btn${gestaoView==='cliente'?' active':''}" onclick="setGestaoView('cliente')" title="Agrupar por cliente">${SVG_CLI} Cliente</button>
          <button class="vt-btn${gestaoView==='projeto'?' active':''}" onclick="setGestaoView('projeto')" title="Agrupar por projeto">${SVG_PROJ} Projeto</button>
        </div>
        <button class="btn cy sm" onclick="openAddTask()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
          Nova demanda
        </button>
      </div>
    </div>
    ${content}`;
}

// ═══════════════════════════════════════════════════════════════
// REPORT ENGINE
// ═══════════════════════════════════════════════════════════════
function heatStyle(v,max){
  if(!max||!v)return'background:rgba(0,229,195,.07);color:rgba(0,229,195,.3)';
  const r=v/max;
  if(r<.2)return'background:rgba(0,229,195,.13);color:rgba(0,229,195,.6)';
  if(r<.4)return'background:rgba(0,229,195,.25);color:rgba(0,229,195,.9)';
  if(r<.6)return'background:rgba(0,229,195,.4);color:#004d43';
  if(r<.8)return'background:rgba(0,229,195,.65);color:#003830';
  return'background:#00e5c3;color:#002820';
}

function buildReport(tasks, container){
  const total=tasks.length;
  const done=tasks.filter(t=>t.status==='concluido').length;
  const pend=total-done;
  const hi=tasks.filter(t=>t.status!=='concluido'&&(t.priority==='alta'||t.priority==='critica')).length;
  const cr=tasks.filter(t=>t.status!=='concluido'&&t.priority==='critica').length;
  const perf=total?Math.round(done/total*100):0;
  const perfColor=perf>=60?'var(--green)':perf>=30?'var(--cyan)':'var(--muted)';

  const byC={},byP={};
  tasks.forEach(t=>{
    const c=t.client||'SEM CLIENTE', p=t.person||'SEM RESPONSÁVEL';
    (byC[c]=byC[c]||[]).push(t);
    (byP[p]=byP[p]||[]).push(t);
  });
  const cs=Object.keys(byC).sort((a,b)=>byC[b].length-byC[a].length);
  const ps=Object.keys(byP).sort((a,b)=>byP[b].length-byP[a].length);
  const maxC=cs.length?Math.max(...cs.map(c=>byC[c].length)):0;
  const maxP=ps.length?Math.max(...ps.map(p=>byP[p].length)):0;

  const hmCli=cs.map(c=>{const n=byC[c].length;return`<div class="hm-row"><div class="hm-lbl" title="${c}">${c}</div><div class="hm-cell" style="${heatStyle(n,maxC)}" data-tip="${n} demanda${n!==1?'s':''}">${n}</div></div>`;}).join('');
  const hmPes=ps.map(p=>{const n=byP[p].length;return`<div class="hm-row"><div class="hm-lbl" title="${p}">${p}</div><div class="hm-cell" style="${heatStyle(n,maxP)}" data-tip="${n} tarefa${n!==1?'s':''}">${n}</div></div>`;}).join('');

  const cols=['concluido','pendente','alta','critica'];
  const cLbl={'concluido':'✅ Concluído','pendente':'⏳ Pendente','alta':'🔺 Alta','critica':'🔥 Crítica'};
  let cg=`<div style="display:grid;grid-template-columns:110px repeat(4,1fr);gap:4px">
    <div></div>${cols.map(c=>`<div style="font-size:10px;font-weight:600;color:var(--muted);text-align:center;padding-bottom:4px">${cLbl[c]}</div>`).join('')}`;
  cs.forEach(c=>{
    cg+=`<div class="hm-lbl" style="line-height:30px" title="${c}">${c}</div>`;
    cols.forEach(pl=>{
      const n=pl==='concluido'?byC[c].filter(t=>t.status==='concluido').length
             :pl==='pendente'?byC[c].filter(t=>t.status!=='concluido'&&(t.priority==='media'||t.priority==='baixa'||!t.priority)).length
             :pl==='alta'?byC[c].filter(t=>t.status!=='concluido'&&t.priority==='alta').length
             :byC[c].filter(t=>t.status!=='concluido'&&t.priority==='critica').length;
      const s=pl==='concluido'?(n?'background:rgba(34,197,94,.2);color:#22c55e':'background:rgba(34,197,94,.05);color:rgba(34,197,94,.3)')
              :pl==='pendente'?(n?'background:rgba(255,255,255,.09);color:#aaa':'background:rgba(255,255,255,.03);color:#444')
              :pl==='alta'?(n?'background:rgba(245,166,35,.2);color:#f5a623':'background:rgba(245,166,35,.05);color:rgba(245,166,35,.3)')
              :(n?'background:rgba(0,229,195,.15);color:var(--cyan)':'background:rgba(0,229,195,.05);color:rgba(0,229,195,.4)');
      cg+=`<div class="hm-cell" style="${s};border-radius:4px" data-tip="${c} — ${cLbl[pl]}: ${n}">${n||'·'}</div>`;
    });
  });
  cg+='</div>';

  const maxPT=ps.length?Math.max(...ps.map(p=>byP[p].length)):0;

  // Stacked bar chart: green (done) + red (open)
  const stackedBars = ps.map(p=>{
    const ts   = byP[p];
    const dn   = ts.filter(t=>t.status==='concluido').length;
    const op   = ts.length - dn;
    const crit = ts.filter(t=>t.status!=='concluido'&&t.priority==='critica').length;
    const alta = ts.filter(t=>t.status!=='concluido'&&t.priority==='alta').length;
    const pct  = ts.length ? Math.round(dn/ts.length*100) : 0;

  const stackedChart = ps.length===0 ? '' : `

      <div style="padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">

    return`<div class="cli-sec">

  container.innerHTML=`
    <div class="sec">
      <div class="slbl">Visão geral</div>

// ROADMAP — cliente → projetos → trilhas paralelas
// ═══════════════════════════════════════════════════════════════
function renderRoadmap(){
  const el = document.getElementById('view-roadmap');

  // Gather all tasks from all lists
  const allTs = allTasks();

  // Build: { clientName: { projectName: [tasks] } }
  const tree = {};
  allTs.forEach(t => {
    const cli  = t.client  || 'SEM CLIENTE';
    const proj = t.project || t.name; // fallback: use task name as project
    if(!tree[cli]) tree[cli] = {};
    if(!tree[cli][proj]) tree[cli][proj] = [];
    tree[cli][proj].push(t);
  });

  // Filter by client if selected
  const clients = Object.keys(tree).sort();
  const filtered = currentRoadmapClient
    ? clients.filter(c => c === currentRoadmapClient)
    : clients;

  // Client filter dropdown options
  const clientFilterOpts = `<option value="">Todos os clientes (${clients.length})</option>`
    + clients.map(c => `<option value="${c}"${currentRoadmapClient===c?' selected':''}>${c}</option>`).join('');

  // Steps derived from task statuses within a project
  function projectSteps(tasks){
    // Group tasks as steps: concluido → done, em andamento → active, pendente → pending
    // Return array of step objects
    const stepMap = {};
    tasks.forEach(t => {
      const key = t.name;
      stepMap[key] = t.status;
    });
    return Object.entries(stepMap).map(([name, status]) => ({name, status}));
  }

  function projectBadge(tasks){
    const total = tasks.length;
    const done  = tasks.filter(t=>t.status==='concluido').length;
    const active= tasks.filter(t=>t.status==='em andamento').length;
    if(done === total) return `<span class="rm-track-badge done">✅ Concluído</span>`;
    if(active > 0)     return `<span class="rm-track-badge active">⏳ Em andamento</span>`;
    return `<span class="rm-track-badge pending">· Aguardando</span>`;
  }

  function dotClass(status){
    if(status==='concluido')     return 'done';
    if(status==='em andamento')  return 'active';
    return 'pending';
  }
  function dotIcon(status){
    if(status==='concluido')    return `<i class="ti ti-check" aria-hidden="true"></i>`;
    if(status==='em andamento') return `<i class="ti ti-player-play" aria-hidden="true"></i>`;
    return `<i class="ti ti-clock" aria-hidden="true"></i>`;
  }
  function connClass(steps, idx){
    if(idx >= steps.length - 1) return '';
    const cur  = steps[idx].status;
    const next = steps[idx+1].status;
    if(cur === 'concluido') return 'done';
    return '';
  }

  function buildTrack(projName, tasks){
    const steps    = projectSteps(tasks);
    const persons  = [...new Set(tasks.map(t=>t.person).filter(Boolean))];
    const stepsHTML = steps.map((s,i) => {
      const dc = dotClass(s.status);
      const conn = i < steps.length-1
        ? `<div class="rm-conn ${connClass(steps,i)}"></div>` : '';
      const shortName = s.name.length > 18 ? s.name.slice(0,16)+'…' : s.name;
      return `
        <div class="rm-step">
          <div class="rm-dot ${dc}">${dotIcon(s.status)}</div>
          <div class="rm-step-lbl ${dc}" title="${s.name}">${shortName}</div>
        </div>
        ${conn}`;
    }).join('');

    return `
      <div class="rm-track">
        <div class="rm-track-info">
          <div class="rm-track-product">${projName}</div>
          <div class="rm-track-person">${persons.join(', ')||'—'}</div>
          ${projectBadge(tasks)}
        </div>
        <div class="rm-steps">${stepsHTML}</div>
      </div>`;
  }

  const clientBlocks = filtered.length === 0
    ? `<div class="rm-empty">Nenhuma tarefa com projeto atribuído ainda.<br>Edite uma tarefa e preencha o campo <b>Projeto / produto</b>.</div>`
    : filtered.map(cli => {
        const projects = tree[cli];
        const projNames = Object.keys(projects).sort();
        const tracks = projNames.map(p => buildTrack(p, projects[p])).join('');
        // client-level summary
        const allCliTasks = projNames.flatMap(p => projects[p]);
        const doneC  = allCliTasks.filter(t=>t.status==='concluido').length;
        const totalC = allCliTasks.length;
        const perf   = totalC ? Math.round(doneC/totalC*100) : 0;
        return `
          <div class="rm-client-block">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.875rem;flex-wrap:wrap;gap:8px">
              <div class="rm-client-name">${cli}</div>
              <div style="display:flex;align-items:center;gap:12px">
                <span style="font-size:12px;color:var(--muted2)">${projNames.length} projeto${projNames.length!==1?'s':''} · ${totalC} tarefa${totalC!==1?'s':''}</span>
                <div style="display:flex;align-items:center;gap:6px">
                  <div style="width:80px;height:4px;background:var(--bg3);border-radius:2px;overflow:hidden">
                    <div style="width:${perf}%;height:100%;background:var(--green);border-radius:2px"></div>
                  </div>
                  <span style="font-size:12px;font-weight:600;color:${perf===100?'var(--green)':'var(--muted)'}">${perf}%</span>
                </div>
                <button class="btn xs cy" onclick="openRoadmap('${cli===currentRoadmapClient?'':cli}')">
                  ${cli===currentRoadmapClient?'Ver todos':'Focar'}
                </button>
              </div>
            </div>
            <div class="rm-tracks">${tracks}</div>
          </div>`;
      }).join('');

  el.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:12px">
      <div>
        <h2 style="font-size:20px;font-weight:700;letter-spacing:-.02em">Roadmap</h2>
        <div style="font-size:12px;color:var(--muted2);margin-top:3px">Projetos em paralelo por cliente</div>
      </div>
      <div class="rm-filter-bar">
        <select class="inp w130" onchange="openRoadmap(this.value)">${clientFilterOpts}</select>
      </div>
    </div>
    ${clientBlocks}
    <div style="font-size:11px;color:var(--muted2);text-align:center;padding-top:1rem;border-top:1px solid var(--border);margin-top:1rem">
      Cada linha = um projeto. Cada etapa = uma tarefa. Edite uma tarefa e preencha <b style="color:var(--muted)">Projeto / produto</b> para agrupar aqui.
    </div>`;
}

// REPORT GENERATOR
// ═══════════════════════════════════════════════════════════════
let RG = {
  semaphore:'green',
  selectedClient:'',
  selectedTasks: new Set(),
  activities:[],
  planned:[],
  pending:[],
  nextsteps:[],
  indicators:[{l:'',v:''},{l:'',v:''},{l:'',v:''},{l:'',v:''},{l:'',v:''}]
};

function rgSel(s){RG.semaphore=s;document.querySelectorAll('.sem-opt').forEach(el=>el.classList.toggle('active',el.dataset.s===s));}

function rgClientChange(){
  const v=document.getElementById('rg-client').value;
  RG.selectedClient=v;
  RG.selectedTasks.clear();
  renderTaskChips();
}

function renderTaskChips(){
  const wrap=document.getElementById('rg-task-chips');
  if(!wrap)return;
  const cli=RG.selectedClient;
  const tasks=allTasks().filter(t=>t.client===cli);
  if(!tasks.length){wrap.innerHTML='<span style="font-size:11px;color:var(--muted2)">Nenhuma tarefa encontrada para este cliente.</span>';return;}
  wrap.innerHTML=tasks.map(t=>`
    <span class="tp-chip${RG.selectedTasks.has(t.id)?' sel':''}" onclick="rgToggleTask('${t.id}')" title="${t.name}">
      <span style="width:6px;height:6px;border-radius:50%;background:${t.status==='concluido'?'var(--green)':t.status==='em andamento'?'var(--amber)':'var(--muted2)'};flex-shrink:0;display:inline-block"></span>
      ${t.name.length>40?t.name.slice(0,38)+'…':t.name}
    </span>`).join('');
}

function rgToggleTask(id){
  if(RG.selectedTasks.has(id))RG.selectedTasks.delete(id);
  else RG.selectedTasks.add(id);
  renderTaskChips();
  rgAutoFillActivities();
}

function rgAutoFillActivities(){
  const tasks=allTasks().filter(t=>RG.selectedTasks.has(t.id));
  RG.activities=tasks.filter(t=>t.status==='concluido'||t.status==='em andamento').map(t=>({
    title:t.name, cat:'Desenvolvimento', prio:t.priority==='critica'?'Alta':t.priority==='alta'?'Alta':t.priority==='media'?'Media':'Baixa',
    status:t.status==='concluido'?'Concluído':'Em andamento', date:t.dueDate||'', resp:t.person||'', obs:t.notes||''
  }));
  RG.planned=tasks.filter(t=>t.status==='pendente').map(t=>({
    title:t.name, cat:'Desenvolvimento', prio:t.priority==='critica'?'Alta':t.priority==='alta'?'Alta':'Media',
    status:'Planejado', date:t.dueDate||'', resp:t.person||'', obs:''
  }));
  renderReportGen();
}

function saveReport(){
  const name = rgVal('rg-client')||RG.selectedClient||'Cliente';
  const period2 = rgVal('rg-period')||isoDate();
  const snap = {
    id: uid(),
    name: `${name} — ${period2}`,
    savedAt: Date.now(),
    client: rgVal('rg-client')||RG.selectedClient||'',
    project: rgVal('rg-project')||'',
    period: period2,
    date: rgVal('rg-date')||todayISO(),
    resp: rgVal('rg-resp')||'',
    version: rgVal('rg-version')||'v1.0',
    company: rgVal('rg-company')||'Sete Company Tecnologia',
    execComment: rgVal('rg-execcomment')||'',
    closing: rgVal('rg-closing')||'',
    semaphore: RG.semaphore,
    indicators: [...RG.indicators],
    activities: JSON.parse(JSON.stringify(RG.activities)),
    planned: JSON.parse(JSON.stringify(RG.planned)),
    pending: JSON.parse(JSON.stringify(RG.pending)),
    nextsteps: JSON.parse(JSON.stringify(RG.nextsteps)),
  };
  if(!S.reports) S.reports=[];
  S.reports.unshift(snap);
  persist();
  toast('✅ Report salvo!');
  renderReportGen();
}

function loadReport(id){
  const snap = S.reports.find(r=>r.id===id);
  if(!snap) return;
  RG.semaphore    = snap.semaphore||'green';
  RG.selectedClient = snap.client||'';
  RG.selectedTasks  = new Set();
  RG.activities   = snap.activities||[];
  RG.planned      = snap.planned||[];
  RG.pending      = snap.pending||[];
  RG.nextsteps    = snap.nextsteps||[];
  RG.indicators   = snap.indicators||[{l:'',v:''},{l:'',v:''},{l:'',v:''},{l:'',v:''},{l:'',v:''}];
  renderReportGen();
  // fill form fields after render
  setTimeout(()=>{
    ['rg-client','rg-project','rg-period','rg-date','rg-resp','rg-version','rg-company','rg-execcomment','rg-closing'].forEach(id2=>{
      const el=document.getElementById(id2);
      if(!el) return;
      const key=id2.replace('rg-','').replace('-','');
      const map={
        'client':snap.client,'project':snap.project,
        'period': snap.period && snap.period.match(/^\d{4}-\d{2}-\d{2}$/) ? fmtDate(snap.period) : snap.period,
        'date':snap.date,'resp':snap.resp,'version':snap.version,
        'company':snap.company,'execcomment':snap.execComment,'closing':snap.closing
      };
      if(map[key]!==undefined) el.value=map[key];
    });
    rgSel(RG.semaphore);
  },50);
  toast('Report carregado!');
}

function deleteReport(id){
  if(!confirm('Excluir este report salvo?')) return;
  S.reports=S.reports.filter(r=>r.id!==id);
  persist();
  renderReportGen();
}

function rgVal(id){const el=document.getElementById(id);return el?el.value.trim():'';}
function rgDynRow(listKey, idx, item, type){
  const rm=`<button class="dyn-rm" onclick="rgRemove('${listKey}',${idx})">✕</button>`;
  const cats=['Desenvolvimento','Infraestrutura','Suporte','Outro'];
